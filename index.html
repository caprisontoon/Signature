  // Themed metallic — kept BRIGHT throughout so the ink stays legible
  // against its themed (dark, same-hue) background. No dark gradient stops.
  const stops = {
    'gold':          [['#ffffff',0],['#fff7c0',0.3],['#ffe066',0.55],['#fffce8',0.75],['#ffd24a',1]],
    'purple-chrome': [['#ffffff',0],['#f0e6ff',0.3],['#c8b0ff',0.55],['#ffffff',0.75],['#e8d8ff',1]],
    'aqua-chrome':   [['#ffffff',0],['#e0fbff',0.3],['#7ee8ff',0.55],['#ffffff',0.75],['#aef0ff',1]],
    'matrix-green':  [['#eaffea',0],['#bdf5bd',0.3],['#5cee7a',0.55],['#dafadc',0.75],['#46d966',1]]
  };

  // 1. Build the themed gradient fill on the ink shape
  const tinted = document.createElement('canvas');
  tinted.width = W; tinted.height = H;
  const tctx = tinted.getContext('2d');
  tctx.drawImage(srcCanvas, 0, 0);

  const grad = tctx.createLinearGradient(0, 0, 0, H);
  for (const [c, p] of stops[style]) grad.addColorStop(p, c);
  tctx.globalCompositeOperation = 'source-in';
  tctx.fillStyle = grad;
  tctx.fillRect(0, 0, W, H);
  tctx.globalCompositeOperation = 'source-over';

  // 2. Build a dark outline by blurring the source and tinting it black,
  //    then erasing the inner ink shape to leave only the rim.
  const outline = document.createElement('canvas');
  outline.width = W; outline.height = H;
  const octx = outline.getContext('2d');
  octx.filter = 'blur(2px)';
  octx.drawImage(srcCanvas, 0, 0);
  octx.filter = 'none';
  octx.globalCompositeOperation = 'source-in';
  octx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  octx.fillRect(0, 0, W, H);

  // 3. Build a bright outer glow (softer, larger blur) to push the ink
  //    away from the background.
  const glow = document.createElement('canvas');
  glow.width = W; glow.height = H;
  const gctx = glow.getContext('2d');
  gctx.filter = 'blur(6px)';
  gctx.drawImage(srcCanvas, 0, 0);
  gctx.filter = 'none';
  gctx.globalCompositeOperation = 'source-in';
  const glowColor = style === 'gold' ? 'rgba(255, 230, 140, 0.85)'
                  : style === 'purple-chrome' ? 'rgba(200, 170, 255, 0.85)'
                  : style === 'matrix-green' ? 'rgba(120, 255, 150, 0.85)'
                  : 'rgba(150, 240, 255, 0.85)';
  gctx.fillStyle = glowColor;
  gctx.fillRect(0, 0, W, H);

  // 4. Compose layers bottom-to-top:
  //    glow → black outline → tinted ink → bright highlight
  const combined = document.createElement('canvas');
  combined.width = W; combined.height = H;
  const cctx = combined.getContext('2d');
  // Outer glow first (softens edges, lights the surroundings)
  cctx.drawImage(glow, 0, 0);
  // Twice for stronger glow
  cctx.drawImage(glow, 0, 0);
  // Dark rim outline so ink edge is clearly separated from any same-hue background
  cctx.drawImage(outline, 0, 0);
  // The tinted ink itself
  cctx.drawImage(tinted, 0, 0);

  return combined;
}

/* ───────────────────────────────────────────────────────────
   Helper · Draw a pen tip / nib at given coordinates
   ─────────────────────────────────────────────────────────── */
function drawPenTip(ctx, x, y, scale = 1) {
  ctx.save();
  // Shadow under pen
  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.beginPath();
  ctx.ellipse(x + 3 * scale, y + 3 * scale, 9 * scale, 4 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pen body — angled like writing pen
  ctx.translate(x, y);
  ctx.rotate(-Math.PI / 4); // 45° tilt

  const len = 70 * scale;
  const w = 8 * scale;

  // Pen barrel (gradient from tip to top)
  const grad = ctx.createLinearGradient(0, 0, 0, -len);
  grad.addColorStop(0, '#1a1a1a');
  grad.addColorStop(0.15, '#2a2a2a');
  grad.addColorStop(0.5, '#8b6f3f');
  grad.addColorStop(1, '#b89766');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-w/2, -10 * scale);
  ctx.lineTo(w/2, -10 * scale);
  ctx.lineTo(w/2 + 1, -len);
  ctx.lineTo(-w/2 - 1, -len);
  ctx.closePath();
  ctx.fill();

  // Pen tip (nib) — triangular metallic
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.moveTo(-w/2, -10 * scale);
  ctx.lineTo(w/2, -10 * scale);
  ctx.lineTo(1, 0);
  ctx.lineTo(-1, 0);
  ctx.closePath();
  ctx.fill();

  // Highlight on barrel
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.fillRect(-w/2 + 1, -len + 5, 1.5 * scale, len - 15);

  // Cap detail
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-w/2 - 1, -len, w + 2, 4 * scale);

  ctx.restore();
}

/* ───────────────────────────────────────────────────────────
   Helper · Trace a path from a transparent image
   Returns ordered (x,y) points along the ink, left-to-right.
   This gives the pen something to "follow" for typed/photo signatures.
   ─────────────────────────────────────────────────────────── */
function tracePathFromImage(imgData, W, H) {
  // Slice image into vertical bands, find center of mass of ink in each band
  const bandCount = 120;
  const bandW = W / bandCount;
  const path = [];
  for (let b = 0; b < bandCount; b++) {
    const x0 = Math.floor(b * bandW);
    const x1 = Math.floor((b + 1) * bandW);
    let sumY = 0, count = 0, sumX = 0;
    for (let y = 0; y < H; y++) {
      for (let x = x0; x < x1; x++) {
        const a = imgData.data[(y * W + x) * 4 + 3];
        if (a > 30) {
          sumY += y;
          sumX += x;
          count++;
        }
      }
    }
    if (count > 0) {
      path.push({ x: sumX / count, y: sumY / count });
    }
  }
  // If path is too sparse, fill in with linear interpolation
  if (path.length < 2) return null;
  return path;
}

/* ───────────────────────────────────────────────────────────
   GIF · From a transparent canvas (typed text or photo signature)
   The pen tip follows a traced path across the signature.
   ─────────────────────────────────────────────────────────── */
function generateGifFromCanvas(srcCanvas, options = {}) {
  return new Promise(async (resolve, reject) => {
    try {
      ensureGifLib();
    } catch (e) { reject(e); return; }

    const frames = options.frames || 54;
    const delay = options.delay || 55;   // 1000/18fps ≈ 55ms → 54frames × 55ms ≈ 3s
    const W = srcCanvas.width, H = srcCanvas.height;
    const fx = options.fx || { background: 'transparent', bgImage: null, effect: 'none', inkStyle: 'plain' };

    let workerURL;
    try {
      workerURL = await getWorkerBlobURL();
    } catch (e) { reject(e); return; }

    // Footer dimensions
    const fh = Math.min(
      SVIP_FOOTER.maxHeight,
      Math.max(SVIP_FOOTER.minHeight, Math.round(W * SVIP_FOOTER.heightRatio))
    );
    const outH = H + fh;

    const useTransparent = isTransparent(fx);
    const gif = new GIF({
      workers: 2,
      quality: 10,
      width: W,
      height: outH,
      ...(useTransparent ? { transparent: 0x00ff00 } : {}),
      workerScript: workerURL
    });

    const srcCtx = srcCanvas.getContext('2d');
    const srcData = srcCtx.getImageData(0, 0, W, H);

    // Bounding box of non-transparent pixels
    let minX = W, maxX = 0, minY = H, maxY = 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const a = srcData.data[(y * W + x) * 4 + 3];
        if (a > 10) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (minX > maxX) { reject(new Error('빈 이미지')); return; }

    // Apply themed ink style
    const inkSource = renderStyledInk(srcCanvas, W, H, fx.inkStyle);

    // Pre-render footer once (it doesn't change across frames)
    const footerCanvas = renderFooterStrip(W, fh);

    const tmp = document.createElement('canvas');
    tmp.width = W;
    tmp.height = outH;
    const tctx = tmp.getContext('2d');

    // Build particle cache once for the full animation
    const cache = buildParticleCache(W, H, fx, 12345);

    // Stamp-specific cache: bbox sized to the actual ink
    if (fx.effect === 'stamp') {
      const bbox = computeInkBBox(srcCanvas) || { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
      cache.stampBBox = bbox;
    }

    const totalFrames = frames;

    for (let f = 0; f < totalFrames; f++) {
      const t = (f + 1) / totalFrames;

      // 1. Background (only on signature area)
      paintBackground(tctx, W, H, fx);

      // 2. Behind-ink effects
      applyBackEffects(tctx, W, H, t, fx, cache);

      // 3. Reveal ink
      if (fx.effect === 'stamp') {
        // Stamp owns the entire ink-compositing stage so it can animate
        // the falling/impact/bounce stages.
        drawStampFrame(tctx, inkSource, t, W, H, cache);
      } else {
        const writeProgress = t;
        const revealX = minX + (maxX - minX + 1) * writeProgress;
        const revealRight = Math.min(W, Math.max(0, Math.ceil(revealX) + 1));
        if (revealRight > 0) {
          tctx.drawImage(inkSource, 0, 0, revealRight, H, 0, 0, revealRight, H);
        }
      }

      // 4. In-front effects
      applyFrontEffects(tctx, W, H, t, fx, cache);

      // 5. Footer strip at the bottom (same on every frame)
      tctx.drawImage(footerCanvas, 0, H);

      const isLast = (f === totalFrames - 1);
      gif.addFrame(tctx, { copy: true, delay: isLast ? 1400 : delay });
    }

    gif.on('finished', (blob) => {
      if (!blob || blob.size === 0) { reject(new Error('빈 GIF가 생성됨')); return; }
      resolve(URL.createObjectURL(blob));
    });
    gif.on('abort', () => reject(new Error('GIF 생성 중단')));

    try {
      gif.render();
    } catch (e) {
      reject(e);
    }
  });
}

/* ───────────────────────────────────────────────────────────
   GIF · From stroke data (hand-drawn signature)
   Pen tip follows the actual drawing path, point by point.
   ─────────────────────────────────────────────────────────── */
function generateGifFromStrokes(strokes, W, H, options = {}) {
  return new Promise(async (resolve, reject) => {
    try {
      ensureGifLib();
    } catch (e) { reject(e); return; }

    const frames = options.frames || 54;
    const delay = options.delay || 55;
    const fx = options.fx || { background: 'transparent', bgImage: null, effect: 'none', inkStyle: 'plain' };

    let workerURL;
    try {
      workerURL = await getWorkerBlobURL();
    } catch (e) { reject(e); return; }

    // Footer dimensions
    const fh = Math.min(
      SVIP_FOOTER.maxHeight,
      Math.max(SVIP_FOOTER.minHeight, Math.round(W * SVIP_FOOTER.heightRatio))
    );
    const outH = H + fh;

    const useTransparent = isTransparent(fx);
    const gif = new GIF({
      workers: 2,
      quality: 10,
      width: W,
      height: outH,
      ...(useTransparent ? { transparent: 0x00ff00 } : {}),
      workerScript: workerURL
    });

    const totalPts = strokes.reduce((sum, s) => sum + s.points.length, 0);

    // Pre-render footer once (it doesn't change across frames)
    const footerCanvas = renderFooterStrip(W, fh);

    const tmp = document.createElement('canvas');
    tmp.width = W;
    tmp.height = outH;
    const tctx = tmp.getContext('2d');

    // Build particle cache once
    const cache = buildParticleCache(W, H, fx, 54321);

    // For stamp: pre-render the entire signature ink and prepare bbox
    let stampInkSource = null;
    if (fx.effect === 'stamp') {
      const fullInk = document.createElement('canvas');
      fullInk.width = W; fullInk.height = H;
      const fctx = fullInk.getContext('2d');
      for (const stroke of strokes) {
        if (stroke.points.length < 2) continue;
        fctx.strokeStyle = stroke.color;
        fctx.lineWidth = stroke.width;
        fctx.lineCap = 'round';
        fctx.lineJoin = 'round';
        fctx.beginPath();
        fctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length - 1; i++) {
          const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
          const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
          fctx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
        }
        const last = stroke.points[stroke.points.length - 1];
        fctx.lineTo(last.x, last.y);
        fctx.stroke();
      }
      stampInkSource = renderStyledInk(fullInk, W, H, 'stamp');
      const bbox = computeInkBBox(fullInk);
      cache.stampBBox = bbox || { x: W * 0.2, y: H * 0.3, w: W * 0.6, h: H * 0.4 };
    }

    const totalFrames = frames;

    for (let f = 0; f < totalFrames; f++) {
      const t = (f + 1) / totalFrames;

      // 1. Background (signature area)
      paintBackground(tctx, W, H, fx);

      // 2. Behind-ink effects
      applyBackEffects(tctx, W, H, t, fx, cache);

      // 3. Render ink
      if (fx.effect === 'stamp') {
        // Stamp branch: animate the complete pre-rendered stamp.
        drawStampFrame(tctx, stampInkSource, t, W, H, cache);
      } else {
        // Default: progressively reveal up to point count
        const targetPts = Math.round(totalPts * t);
        const inkCanvas = document.createElement('canvas');
        inkCanvas.width = W; inkCanvas.height = H;
        const ictx = inkCanvas.getContext('2d');

        let drawnPts = 0;
        for (const stroke of strokes) {
          const remaining = targetPts - drawnPts;
          if (remaining <= 0) break;
          const pointsToDraw = Math.min(stroke.points.length, remaining);
          if (pointsToDraw < 2) { drawnPts += pointsToDraw; continue; }

          ictx.strokeStyle = stroke.color;
          ictx.lineWidth = stroke.width;
          ictx.lineCap = 'round';
          ictx.lineJoin = 'round';
          ictx.beginPath();
          ictx.moveTo(stroke.points[0].x, stroke.points[0].y);
          for (let i = 1; i < pointsToDraw - 1; i++) {
            const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
            const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
            ictx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
          }
          if (pointsToDraw > 1) {
            const last = stroke.points[pointsToDraw - 1];
            ictx.lineTo(last.x, last.y);
          }
          ictx.stroke();
          drawnPts += stroke.points.length;
        }

        // Apply themed ink style
        const inkToUse = renderStyledInk(inkCanvas, W, H, fx.inkStyle);
        tctx.drawImage(inkToUse, 0, 0);
      }

      // 4. In-front effects
      applyFrontEffects(tctx, W, H, t, fx, cache);

      // 5. Footer strip at the bottom (same on every frame)
      tctx.drawImage(footerCanvas, 0, H);

      const isLast = (f === totalFrames - 1);
      gif.addFrame(tctx, { copy: true, delay: isLast ? 1400 : delay });
    }

    gif.on('finished', (blob) => {
      if (!blob || blob.size === 0) { reject(new Error('빈 GIF가 생성됨')); return; }
      resolve(URL.createObjectURL(blob));
    });
    gif.on('abort', () => reject(new Error('GIF 생성 중단')));

    try {
      gif.render();
    } catch (e) {
      reject(e);
    }
  });
}

function downloadURL(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function showLoading(btn, msg = 'Processing') {
  btn.dataset.orig = btn.innerHTML;
  btn.innerHTML = `<span class="loader"></span>${msg}`;
  btn.disabled = true;
}
function hideLoading(btn) {
  btn.innerHTML = btn.dataset.orig;
  btn.disabled = false;
}

/* ═══════════════════════════════════════════════════════════
   ENCODING HELPERS · reused by the "시그니처 사용하기" flow
   ─────────────────────────────────────────────────────────────
   The old format-picker UI was removed; the encoding functions
   (encodeWebmFromFramePlan / encodeMp4FromFramePlan / renderGifFromPlan)
   remain and are invoked directly from the preview-and-use popup.
   ═══════════════════════════════════════════════════════════ */

/* GIF encoder using FramePlan (kept for reuse). */
async function renderGifFromPlan(plan, options = {}) {
  ensureGifLib();
  const { onProgress } = options;
  const { renderFrame, totalFrames, W, outH } = plan;
  const workerURL = await getWorkerBlobURL();
  const gif = new GIF({
    workers: 2, quality: 10, width: W, height: outH,
    workerScript: workerURL
  });
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = outH;
  const tctx = tmp.getContext('2d');
  const delay = 55;
  for (let f = 0; f < totalFrames; f++) {
    const t = (f + 1) / totalFrames;
    renderFrame(tctx, t);
    const isLast = (f === totalFrames - 1);
    gif.addFrame(tctx, { copy: true, delay: isLast ? 1400 : delay });
    if (onProgress) onProgress('프레임 생성 중...', 0.10 + (f / totalFrames) * 0.40);
  }
  return new Promise((resolve, reject) => {
    gif.on('progress', p => {
      if (onProgress) onProgress('GIF 인코딩 중...', 0.50 + p * 0.45);
    });
    gif.on('finished', blob => {
      if (!blob || blob.size === 0) { reject(new Error('빈 GIF')); return; }
      resolve(URL.createObjectURL(blob));
    });
    gif.on('abort', () => reject(new Error('GIF 생성 중단')));
    gif.render();
  });
}

const useSigReplay       = document.getElementById('useSigReplay');
const useSigProgress     = document.getElementById('useSigProgress');
const useSigProgressText = document.getElementById('useSigProgressText');
const useSigProgressFill = document.getElementById('useSigProgressFill');
const confirmUseSigBtn   = document.getElementById('confirmUseSig');

const PREVIEW_DURATION_MS = 3000;   // live preview always 3 seconds
let _useSigRaf = null;
let _useSigPlan = null;
let _useSigBusy = false;             // true while producing the final video

function stopPreviewLoop() {
  if (_useSigRaf !== null) { cancelAnimationFrame(_useSigRaf); _useSigRaf = null; }
}

/* Build a frame plan for the current strokes + selected effects.
   transparentMode:false keeps the background + effects + nickname footer
   composited into every frame. For the "효과 없음" case we tag the fx with
   _noneBg so paintBackground() paints a light paper background (keeping the
   dark ink legible) instead of the chroma-key fill. */
function buildUseSigPlan() {
  const fx = getEffectsState();
  if (fx.effect === 'none') fx._noneBg = '#f4f6fa';
  return makeFramePlanFromStrokes(strokes, drawCanvas.width, drawCanvas.height, {
    fx,
    frames: 72,
    transparentMode: false,
    outputFormat: 'webm'
  });
}

/* Play the 3-second preview once on the canvas, then show the replay button. */
function playPreviewOnce() {
  if (!_useSigPlan) return;
  stopPreviewLoop();
  useSigReplay.classList.remove('show');
  const ctx = useSigCanvas.getContext('2d');
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / PREVIEW_DURATION_MS);
    ctx.clearRect(0, 0, useSigCanvas.width, useSigCanvas.height);
    _useSigPlan.renderFrame(ctx, t);
    if (t < 1) {
      _useSigRaf = requestAnimationFrame(frame);
    } else {
      _useSigRaf = null;
      useSigReplay.classList.add('show');
    }
  }
  _useSigRaf = requestAnimationFrame(frame);
}

function openUseSig() {
  if (strokes.length === 0) return;            // button is disabled anyway
  if (!getNicknameOrAlert()) return;
  syncNickname();

  let plan;
  try {
    plan = buildUseSigPlan();
  } catch (err) {
    toast('서명을 먼저 그려주세요');
    return;
  }
  _useSigPlan = plan;
  _useSigBusy = false;

  // Size the preview canvas to the plan output (W × outH)
  useSigCanvas.width = plan.W;
  useSigCanvas.height = plan.outH;
  useSigCanvas.style.display = 'block';
  useSigVideo.style.display = 'none';
  useSigVideo.removeAttribute('src');

  // Reset UI
  useSigProgress.classList.remove('show');
  useSigProgressFill.style.width = '0%';
  confirmUseSigBtn.disabled = false;
  confirmUseSigBtn.textContent = '시그니처 사용하기';

  useSigModal.classList.add('open');
  document.body.style.overflow = 'hidden';
  playPreviewOnce();
}

function closeUseSig() {
  // Don't allow closing in the middle of production
  if (_useSigBusy) return;
  stopPreviewLoop();
  useSigModal.classList.remove('open');
  document.body.style.overflow = '';
  _useSigPlan = null;
}

useSigReplay.addEventListener('click', playPreviewOnce);
document.getElementById('useSigClose').addEventListener('click', closeUseSig);
useSigModal.addEventListener('click', (e) => { if (e.target === useSigModal) closeUseSig(); });

document.getElementById('previewUseSig').addEventListener('click', openUseSig);

/* Produce the final 3-second WebM and register it as the current signature. */
confirmUseSigBtn.addEventListener('click', async () => {
  if (_useSigBusy) return;
  if (!getNicknameOrAlert()) return;
  if (!confirm('이 시그니처를 사용하시겠습니까?')) return;

  syncNickname();
  _useSigBusy = true;
  stopPreviewLoop();
  useSigReplay.classList.remove('show');
  confirmUseSigBtn.disabled = true;
  useSigProgress.classList.add('show');
  useSigProgressText.textContent = '준비 중...';
  useSigProgressFill.style.width = '2%';

  const setProg = (text, ratio) => {
    useSigProgressText.textContent = text;
    useSigProgressFill.style.width = `${Math.round((ratio || 0) * 100)}%`;
  };

  try {
    const usingVideo = getEffectsState().effect === 'custom-video' && window._fxVideo;
    if (usingVideo) {
      await prepareFxVideoFrames(72, setProg);
    }
    // Rebuild the plan fresh so it picks up the latest nickname/effects.
    const plan = buildUseSigPlan();
    const out = await encodeWebmFromFramePlan(plan, { fps: 24, onProgress: setProg });

    // Register as the current signature
    if (currentSignatureURL) { try { URL.revokeObjectURL(currentSignatureURL); } catch (e) {} }
    currentSignatureURL = out.url;

    setProg('완료', 1.0);
    _useSigBusy = false;
    alert('시그니처 제작이 완료되었습니다. 이 시그니처를 사용하실 수 있습니다.');
    closeUseSig();
    updateSigButtons();
  } catch (err) {
    console.error('시그니처 제작 실패:', err);
    _useSigBusy = false;
    confirmUseSigBtn.disabled = false;
    setProg('실패 — 다시 시도해 주세요', 0);
    toast('시그니처 제작 실패: ' + (err.message || err));
  }
});

/* ESC closes the preview-and-use popup (not while producing).
   The current-signature popup is intentionally close-button-only. */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (useSigModal.classList.contains('open')) closeUseSig();
});

/* Initial button state */
updateSigButtons();

// 이전 버전에서 로그인 기능이 잠시 도입되었다가 제거되었습니다.
// 남아있을 수 있는 localStorage 잔여 데이터를 한 번 정리합니다.
try {
  localStorage.removeItem('sigstudio.users.v1');
  localStorage.removeItem('sigstudio.session.v1');
} catch (_) {}

</script>
</body>
</html>
