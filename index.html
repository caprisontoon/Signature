<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVIP 시그니처 스튜디오 · TOONATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Caveat:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&family=Great+Vibes&family=Allura&family=Sacramento&family=Pinyon+Script&family=Homemade+Apple&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
// Load gif.js with fallback to multiple CDNs
(function loadGifLib() {
  const urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js',
    'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js',
    'https://unpkg.com/gif.js@0.2.0/dist/gif.js'
  ];
  let idx = 0;
  function tryNext() {
    if (idx >= urls.length) {
      console.error('All gif.js CDNs failed to load.');
      return;
    }
    const s = document.createElement('script');
    s.src = urls[idx++];
    s.onload = () => console.log('gif.js loaded:', s.src);
    s.onerror = () => { console.warn('gif.js failed:', s.src); tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
<style>
/* ═══════════════════════════════════════════════════════════
   TOONATION · SVIP SIGNATURE EFFECT STUDIO
   Design System Tokens
   ═══════════════════════════════════════════════════════════ */

:root {
  /* Toonation Brand Colors */
  --toonation-blue:        #4B96FF;
  --toonation-blue-hover:  #3A82E8;
  --toonation-blue-active: #2B70D0;
  --toonation-navy:        #1E4B78;
  --toonation-navy-dark:   #143553;
  --toonation-blue-50:     #EAF3FF;
  --toonation-blue-100:    #D4E7FF;
  --toonation-blue-200:    #A8CFFF;
  --toonation-charcoal:    #0F0F0F;

  --primary-normal:    var(--toonation-blue);
  --primary-strong:    var(--toonation-blue-hover);
  --primary-heavy:     var(--toonation-blue-active);
  --primary-bg-weak:   var(--toonation-blue-50);
  --primary-bg-strong: var(--toonation-blue-100);

  /* Label */
  --label-normal: #1A1B1F;
  --label-strong: #000000;
  --label-neutral: #45474B;
  --label-alternative: #8A8C92;
  --label-assistive: #B5B7BC;
  --label-disable: #D8DADE;

  /* Background */
  --bg-normal: #FFFFFF;
  --bg-alternative: #F6F7F9;

  /* Fill */
  --fill-normal: rgba(15, 15, 15, 0.04);
  --fill-strong: rgba(15, 15, 15, 0.08);
  --fill-alternative: rgba(15, 15, 15, 0.16);

  /* Lines */
  --line-normal: rgba(15, 15, 15, 0.10);
  --line-neutral: rgba(15, 15, 15, 0.18);
  --line-alternative: rgba(15, 15, 15, 0.06);
  --line-solid-normal: #E4E6EB;

  /* Status */
  --status-positive: #00B843;
  --status-cautionary: #FFB800;
  --status-negative: #FF4949;

  /* Elevation */
  --elev-1: 0 1px 2px rgba(15, 15, 15, 0.04), 0 1px 3px rgba(15, 15, 15, 0.06);
  --elev-2: 0 2px 4px rgba(15, 15, 15, 0.04), 0 4px 12px rgba(15, 15, 15, 0.08);
  --elev-3: 0 8px 16px rgba(15, 15, 15, 0.06), 0 16px 32px rgba(15, 15, 15, 0.10);
  --elev-toonation: 0 6px 24px rgba(75, 150, 255, 0.20), 0 2px 8px rgba(75, 150, 255, 0.12);

  /* Radius */
  --r-xs: 4px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --r-xl: 18px; --r-2xl: 24px; --r-pill: 999px;

  /* Spacing */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-7: 28px; --s-8: 32px;
  --s-10: 40px; --s-12: 48px; --s-16: 64px; --s-20: 80px;
}

[data-theme="dark"] {
  --label-normal: #ECEDF0;
  --label-strong: #FFFFFF;
  --label-neutral: #C2C4CC;
  --label-alternative: #898C94;
  --label-assistive: #5F6168;
  --label-disable: #3D3F45;

  --bg-normal: #15171A;
  --bg-alternative: #0F1114;

  --fill-normal: rgba(255, 255, 255, 0.05);
  --fill-strong: rgba(255, 255, 255, 0.10);
  --fill-alternative: rgba(255, 255, 255, 0.16);

  --line-normal: rgba(255, 255, 255, 0.10);
  --line-neutral: rgba(255, 255, 255, 0.18);
  --line-alternative: rgba(255, 255, 255, 0.06);
  --line-solid-normal: #2A2D33;

  --primary-bg-weak: rgba(75, 150, 255, 0.14);
  --primary-bg-strong: rgba(75, 150, 255, 0.24);

  --elev-1: 0 1px 2px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  --elev-2: 0 2px 4px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.4);
  --elev-3: 0 8px 16px rgba(0,0,0,0.5), 0 16px 32px rgba(0,0,0,0.5);
  --elev-toonation: 0 6px 24px rgba(75, 150, 255, 0.35), 0 2px 8px rgba(75, 150, 255, 0.20);
}

/* ═══════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════ */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--bg-alternative);
  color: var(--label-normal);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  min-height: 100vh;
  transition: background-color 0.3s, color 0.3s;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, select, textarea {
  font-family: inherit;
  color: inherit;
}

::selection { background: var(--toonation-blue-100); color: var(--toonation-navy); }
[data-theme="dark"] ::selection { color: var(--toonation-blue); background: var(--toonation-navy); }

/* ═══════════════════════════════════════════════════════════
   APP SHELL · sidebar + main
   ═══════════════════════════════════════════════════════════ */

.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
  transition: grid-template-columns 0.25s ease;
}

/* Collapsed sidebar: narrow column, icons only */
body.sidebar-collapsed .app {
  grid-template-columns: 72px 1fr;
}

/* ─── Sidebar ─── */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--bg-normal);
  border-right: 1px solid var(--line-normal);
  display: flex;
  flex-direction: column;
  padding: var(--s-5) var(--s-4);
  overflow-y: auto;
  overflow-x: hidden;
}

body.sidebar-collapsed .sidebar {
  padding: var(--s-5) var(--s-2);
}

/* ─── Hamburger toggle ─── */
.sidebar-toggle {
  position: absolute;
  top: 16px;
  right: 12px;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  border-radius: var(--r-sm);
  cursor: pointer;
  color: var(--label-neutral);
  display: grid;
  place-items: center;
  transition: all 0.15s;
  z-index: 5;
}

.sidebar-toggle:hover {
  background: var(--fill-normal);
  color: var(--label-normal);
}

body.sidebar-collapsed .sidebar-toggle {
  right: 50%;
  transform: translateX(50%);
}

/* Mobile floating toggle (when sidebar is offscreen) */
.sidebar-toggle-mobile {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  width: 40px;
  height: 40px;
  border-radius: var(--r-md);
  background: var(--bg-normal);
  border: 1px solid var(--line-normal);
  cursor: pointer;
  color: var(--label-normal);
  z-index: 200;
  place-items: center;
  box-shadow: var(--elev-2);
}

@media (max-width: 768px) {
  .sidebar-toggle-mobile { display: none; }
  .sidebar-toggle { display: grid; }
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-2) var(--s-6);
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: inherit;
  transition: opacity 0.15s;
  width: 100%;
  padding-right: 44px; /* room for hamburger */
}

body.sidebar-collapsed .brand {
  padding: var(--s-3) 0 var(--s-6);
  justify-content: center;
}

body.sidebar-collapsed .brand-text {
  display: none;
}

body.sidebar-collapsed .nav-section-label {
  display: none;
}

body.sidebar-collapsed .tab {
  justify-content: center;
  padding: var(--s-3) 0;
}

body.sidebar-collapsed .tab > svg + * {
  display: none; /* hide label & num */
}

body.sidebar-collapsed .tab > .num {
  display: none;
}

/* Collapsed: keep tabs as single-line, no text overflow */
body.sidebar-collapsed .tab,
body.sidebar-collapsed .theme-toggle-label {
  white-space: nowrap;
  overflow: hidden;
}

body.sidebar-collapsed .tab.active::before {
  left: -8px;
}

body.sidebar-collapsed .theme-toggle {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: var(--s-3) var(--s-2);
}

body.sidebar-collapsed .theme-toggle-label > svg + * {
  display: none;
}

body.sidebar-collapsed #todayDate {
  display: none;
}

.brand:hover {
  opacity: 0.75;
}

.brand:active {
  opacity: 0.6;
}

.brand-logo {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.brand-logo svg { width: 100%; height: 100%; }

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.brand-text .brand-name {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -0.03em;
  color: var(--label-strong);
}

.brand-text .brand-product {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--label-alternative);
  margin-top: 2px;
  font-weight: 600;
  text-transform: uppercase;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--label-alternative);
  padding: var(--s-3) var(--s-3) var(--s-1);
  margin-top: var(--s-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* Each tab nav item — keeps .tab class for JS compatibility */
.tab {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3);
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 500;
  color: var(--label-neutral);
  width: 100%;
  text-align: left;
  transition: all 0.15s;
  position: relative;
  background: transparent;
  border: none;
  cursor: pointer;
}

.tab:hover {
  background: var(--fill-normal);
  color: var(--label-normal);
}

.tab.active {
  background: var(--primary-bg-weak);
  color: var(--primary-normal);
  font-weight: 600;
}

.tab.active::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  background: var(--toonation-blue);
  border-radius: 0 var(--r-xs) var(--r-xs) 0;
}

.tab .num {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 600;
  background: var(--fill-strong);
  color: var(--label-alternative);
  padding: 2px 6px;
  border-radius: var(--r-xs);
  margin-left: auto;
}

.tab.active .num {
  background: var(--toonation-blue);
  color: white;
}

.tab svg { flex-shrink: 0; }

.sidebar-footer {
  border-top: 1px solid var(--line-alternative);
  padding-top: var(--s-3);
  margin-top: var(--s-3);
}

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--s-3);
  border-radius: var(--r-md);
  background: var(--fill-normal);
  cursor: pointer;
  transition: background 0.15s;
}

.theme-toggle:hover { background: var(--fill-strong); }

.theme-toggle-label {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-size: 14px;
  color: var(--label-normal);
  font-weight: 500;
}

.toggle-switch {
  width: 36px;
  height: 20px;
  border-radius: var(--r-pill);
  background: var(--fill-strong);
  position: relative;
  transition: background 0.2s;
}

.toggle-switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: white;
  box-shadow: var(--elev-1);
  transition: transform 0.2s;
}

[data-theme="dark"] .toggle-switch { background: var(--toonation-blue); }
[data-theme="dark"] .toggle-switch::after { transform: translateX(16px); }

/* ═══════════════════════════════════════════════════════════
   MAIN
   ═══════════════════════════════════════════════════════════ */

.main {
  padding: var(--s-8) var(--s-10);
  max-width: 1400px;
  width: 100%;
}

@media (max-width: 1100px) {
  .main { padding: var(--s-6); }
  .app { grid-template-columns: 220px 1fr; }
}

/* ─── Hero Banner ─── */
.hero-banner {
  background: linear-gradient(135deg, var(--toonation-navy) 0%, var(--toonation-charcoal) 100%);
  border-radius: var(--r-xl);
  padding: var(--s-6) var(--s-8);
  margin-bottom: var(--s-6);
  color: white;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-6);
}

.hero-banner::before {
  content: "";
  position: absolute;
  top: -50%;
  right: -10%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(75, 150, 255, 0.3) 0%, transparent 70%);
  pointer-events: none;
}

.hero-banner::after {
  content: "";
  position: absolute;
  bottom: -30%;
  right: 30%;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(140, 91, 255, 0.25) 0%, transparent 70%);
  pointer-events: none;
}

.hero-content { position: relative; z-index: 1; }

.hero-eyebrow {
  display: inline-block;
  background: linear-gradient(135deg, #4B96FF 0%, #8C5BFF 100%);
  color: white;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

.hero-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: var(--s-1);
}

.hero-subtitle {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  line-height: 1.5;
}

/* ─── Page Header ─── */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s-6);
  margin-bottom: var(--s-6);
  padding-bottom: var(--s-5);
  border-bottom: 1px solid var(--line-normal);
}

.page-title-group h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--label-strong);
  margin-bottom: 4px;
}

.page-title-group p {
  font-size: 14px;
  color: var(--label-alternative);
}

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: 0 var(--s-4);
  height: 40px;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  transition: all 0.15s;
  white-space: nowrap;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
  font-family: inherit;
}

.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Two-line action button: main label on top, small format hint below */
.btn-stacked {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  height: auto;
  min-height: 48px;
  padding: var(--s-2) var(--s-3);
  line-height: 1.15;
}
.btn-stacked .btn-main {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.btn-stacked .btn-sub {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  opacity: 0.75;
  text-transform: uppercase;
}

.btn-primary {
  background: var(--toonation-blue);
  color: white;
  box-shadow: 0 1px 2px rgba(75, 150, 255, 0.20);
}

.btn-primary:hover:not(:disabled) {
  background: var(--toonation-blue-hover);
  box-shadow: var(--elev-toonation);
  transform: translateY(-1px);
}

.btn-primary:active:not(:disabled) {
  background: var(--toonation-blue-active);
  transform: translateY(0);
}

.btn-secondary {
  background: var(--fill-normal);
  color: var(--label-normal);
}

.btn-secondary:hover:not(:disabled) { background: var(--fill-strong); }

.btn-outline {
  background: transparent;
  border: 1px solid var(--line-solid-normal);
  color: var(--label-normal);
}

.btn-outline:hover:not(:disabled) {
  background: var(--fill-normal);
  border-color: var(--label-neutral);
}

.btn-ghost {
  background: transparent;
  color: var(--label-neutral);
}

.btn-ghost:hover:not(:disabled) {
  background: var(--fill-normal);
  color: var(--label-normal);
}

.btn-danger {
  background: transparent;
  color: var(--status-negative);
  border: 1px solid transparent;
}

.btn-danger:hover { background: rgba(255, 73, 73, 0.08); }

.btn-svip {
  background: linear-gradient(135deg, var(--toonation-blue) 0%, var(--toonation-navy) 100%);
  color: white;
  position: relative;
  overflow: hidden;
}

.btn-svip::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform 0.5s;
}

.btn-svip:hover::before { transform: translateX(100%); }

/* ═══════════════════════════════════════════════════════════
   EFFECTS BAR
   ═══════════════════════════════════════════════════════════ */

.fx-bar {
  background: var(--bg-normal);
  border: 1px solid var(--line-normal);
  border-radius: var(--r-xl);
  padding: var(--s-5);
  margin-bottom: var(--s-6);
  display: flex;
  flex-direction: column;
  gap: var(--s-5);
}

.fx-section { min-width: 0; }
.fx-section-effects { min-width: 0; }

.fx-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  margin-bottom: 8px;
}

/* Accordion-style toggle that sits below the grid.
   Visual: full-width divider line with a centered pill button on top. */
.fx-toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  background: transparent;
  border: 0;
  padding: 0;
  width: 100%;
  margin-top: 14px;
  cursor: pointer;
  font-family: inherit;
}

.fx-toggle-line {
  flex: 1;
  height: 1px;
  background: var(--line-normal);
  transition: background 0.15s;
}

.fx-toggle-pill {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--bg-normal);
  border: 1px solid var(--line-normal);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--label-normal);
  transition: all 0.15s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

.fx-toggle:hover .fx-toggle-pill {
  border-color: var(--toonation-blue);
  color: var(--toonation-blue);
  background: var(--primary-bg-weak);
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(75,150,255,0.15);
}

.fx-toggle:hover .fx-toggle-line {
  background: var(--toonation-blue);
  opacity: 0.4;
}

.fx-toggle-arrow {
  transition: transform 0.25s ease;
}

.fx-toggle[aria-expanded="true"] .fx-toggle-arrow {
  transform: rotate(180deg);
}

.fx-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--label-normal);
  margin-bottom: 8px;
  display: block;
}

.fx-row { display: flex; gap: 8px; align-items: center; }

.fx-select {
  flex: 1;
  min-width: 0;
}

.fx-file {
  flex: 0 0 auto;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
  padding: 10px 14px;
  border: 1px solid var(--line-solid-normal);
  border-radius: var(--r-md);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  background: var(--bg-normal);
  color: var(--label-normal);
}

.fx-file:hover {
  border-color: var(--toonation-blue);
  color: var(--toonation-blue);
}

.fx-file input { display: none; }

/* ─── Custom video upload row ─── */
.fx-video-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.fx-video-name {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--label-alternative);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 240px;
}
.fx-video-remove {
  font-size: 11px;
  padding: 6px 10px;
  border: 1px solid var(--line-solid-normal);
  border-radius: var(--r-sm);
  background: var(--bg-normal);
  color: var(--status-negative);
  cursor: pointer;
}
.fx-video-remove:hover { border-color: var(--status-negative); }
body.sidebar-collapsed .fx-video-row { display: none; }

/* ─── Effect card grid ─── */
.fx-grid {
  display: grid;
  /* Fixed column count so cards fit on a single horizontal row.
     6 cards per row works well across desktop widths. */
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}
/* Collapsed: only the first 6 cards (one row) are visible */
.fx-grid.fx-grid-collapsed .fx-card:nth-child(n+7) {
  display: none;
}

@media (max-width: 1100px) {
  .fx-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .fx-grid.fx-grid-collapsed .fx-card:nth-child(n+6) { display: none; }
}
@media (max-width: 900px) {
  .fx-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .fx-grid.fx-grid-collapsed .fx-card:nth-child(n+5) { display: none; }
}
@media (max-width: 700px) {
  .fx-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fx-grid.fx-grid-collapsed .fx-card:nth-child(n+4) { display: none; }
}
@media (max-width: 500px) {
  .fx-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fx-grid.fx-grid-collapsed .fx-card:nth-child(n+3) { display: none; }
}

.fx-card {
  position: relative;
  background: var(--bg-alternative);
  border: 2px solid var(--line-normal);
  border-radius: var(--r-md);
  padding: 0;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.15s;
  font-family: inherit;
  display: flex;
  flex-direction: column;
}

.fx-card:hover {
  border-color: var(--label-alternative);
  transform: translateY(-1px);
  box-shadow: var(--elev-1);
}

.fx-card.active {
  border-color: var(--toonation-blue);
  box-shadow: 0 0 0 2px rgba(75, 150, 255, 0.18);
}

.fx-card-canvas {
  display: block;
  width: 100%;
  height: 64px;
  background:
    linear-gradient(45deg, var(--fill-alternative) 25%, transparent 25%),
    linear-gradient(-45deg, var(--fill-alternative) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--fill-alternative) 75%),
    linear-gradient(-45deg, transparent 75%, var(--fill-alternative) 75%);
  background-size: 10px 10px;
  background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
  background-color: var(--bg-alternative);
}

.fx-card-name {
  padding: 6px 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--label-normal);
  text-align: center;
  line-height: 1.3;
  background: var(--bg-normal);
  border-top: 1px solid var(--line-normal);
}

.fx-card-name small {
  display: block;
  font-size: 9.5px;
  font-weight: 500;
  color: var(--label-alternative);
  margin-top: 1px;
}

.fx-card-check {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 18px;
  height: 18px;
  background: var(--toonation-blue);
  color: white;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.fx-card.active .fx-card-check {
  display: flex;
}

/* Hide effects bar on Gallery tab */
body.gallery-mode .fx-bar { display: none; }

/* ═══════════════════════════════════════════════════════════
   WORKSPACE LAYOUT (Type/Draw/Photo)
   ═══════════════════════════════════════════════════════════ */

.workspace {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: var(--s-6);
  align-items: start;
}

@media (max-width: 1100px) {
  .workspace { grid-template-columns: 1fr; }
  /* On narrow screens, show the canvas (stage) first, then the settings
     panel beneath it — makes it easier to see the result while scrolling. */
  .workspace > .stage { order: 1; }
  .workspace > .panel { order: 2; }
}

/* ─── Cards (panels) ─── */
.panel {
  background: var(--bg-normal);
  border: 1px solid var(--line-normal);
  border-radius: var(--r-xl);
  padding: var(--s-6);
  position: relative;
}

.panel-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--label-strong);
  letter-spacing: -0.025em;
  margin-bottom: var(--s-2);
  display: flex;
  align-items: center;
  gap: var(--s-2);
}

.panel-title::before {
  content: "";
  width: 4px;
  height: 16px;
  background: var(--toonation-blue);
  border-radius: 2px;
  display: inline-block;
}

/* ─── Form fields ─── */
.field {
  margin-bottom: var(--s-5);
}

.field label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--label-normal);
  margin-bottom: 8px;
}

.input, .select {
  width: 100%;
  height: 44px;
  padding: 0 var(--s-4);
  background: var(--bg-normal);
  border: 1px solid var(--line-solid-normal);
  border-radius: var(--r-md);
  font-size: 14px;
  color: var(--label-normal);
  outline: none;
  transition: all 0.15s;
}

.input:hover, .select:hover {
  border-color: var(--label-alternative);
}

.input:focus, .select:focus {
  border-color: var(--toonation-blue);
  box-shadow: 0 0 0 3px var(--primary-bg-weak);
}

.input::placeholder { color: var(--label-assistive); }

.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' stroke='%238A8C92' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right var(--s-4) center;
  appearance: none;
  cursor: pointer;
  padding-right: 40px;
}

/* ─── Range slider ─── */
.range-row {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}

.range-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--fill-strong);
  border-radius: var(--r-pill);
  outline: none;
}

.range-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  background: white;
  border: 2px solid var(--toonation-blue);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: var(--elev-1);
  transition: transform 0.15s, box-shadow 0.15s;
}

.range-row input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.15);
  box-shadow: 0 0 0 6px var(--primary-bg-weak);
}

.range-row input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  background: white;
  border: 2px solid var(--toonation-blue);
  border-radius: 50%;
  cursor: pointer;
}

.range-row .val {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--label-alternative);
  min-width: 40px;
  text-align: right;
  font-weight: 600;
}

/* ─── Curve-smoothing stepper (one step per click) ─── */
.smooth-stepper {
  display: flex;
  align-items: center;
  gap: 10px;
}
.smooth-btn {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  border: 1px solid var(--line-solid-normal);
  border-radius: var(--r-md);
  background: var(--bg-normal);
  color: var(--label-normal);
  font-size: 20px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: all 0.15s;
}
.smooth-btn:hover:not(:disabled) {
  border-color: var(--toonation-blue);
  color: var(--toonation-blue);
}
.smooth-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.smooth-level {
  flex: 1;
  text-align: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--label-normal);
}

/* ─── Font / Color chips ─── */
.font-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--s-2);
  margin-bottom: 8px;
}

.font-chip {
  border: 1px solid var(--line-solid-normal);
  background: var(--bg-normal);
  border-radius: var(--r-md);
  padding: var(--s-3);
  font-size: 18px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--label-normal);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.font-chip:hover {
  border-color: var(--label-neutral);
  background: var(--fill-normal);
}

.font-chip.active {
  background: var(--primary-bg-weak);
  border-color: var(--toonation-blue);
  color: var(--toonation-navy);
  font-weight: 600;
}

[data-theme="dark"] .font-chip.active { color: var(--toonation-blue); }

/* Color chip variant — used for ink color */
.font-chip[data-color] {
  font-size: 0;
  min-height: 44px;
  position: relative;
  padding: 0;
  border: 1px solid var(--line-solid-normal) !important;
  background: var(--bg-normal) !important;
  color: transparent !important;
}

.font-chip[data-color]::after {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: var(--r-sm);
  background: var(--chip-color, currentColor);
  transition: transform 0.15s;
}

.font-chip[data-color].active::after {
  transform: scale(0.85);
  box-shadow: 0 0 0 2px white, 0 0 0 4px var(--toonation-blue);
}

[data-theme="dark"] .font-chip[data-color].active::after {
  box-shadow: 0 0 0 2px var(--bg-normal), 0 0 0 4px var(--toonation-blue);
}

/* White/very-light ink swatches get a visible outline so the chip itself is visible */
.font-chip[data-color="#FFFFFF"]::after,
.font-chip[data-color="#ffffff"]::after,
.font-chip[data-color="#fff"]::after {
  box-shadow: inset 0 0 0 1.5px #c8cdd4;
}
[data-theme="dark"] .font-chip[data-color="#FFFFFF"]::after,
[data-theme="dark"] .font-chip[data-color="#ffffff"]::after,
[data-theme="dark"] .font-chip[data-color="#fff"]::after {
  box-shadow: inset 0 0 0 1.5px #5a6068;
}
/* Keep the active highlight together with the outline */
.font-chip[data-color="#FFFFFF"].active::after,
.font-chip[data-color="#ffffff"].active::after,
.font-chip[data-color="#fff"].active::after {
  box-shadow: inset 0 0 0 1.5px #c8cdd4, 0 0 0 2px white, 0 0 0 4px var(--toonation-blue);
}
[data-theme="dark"] .font-chip[data-color="#FFFFFF"].active::after,
[data-theme="dark"] .font-chip[data-color="#ffffff"].active::after,
[data-theme="dark"] .font-chip[data-color="#fff"].active::after {
  box-shadow: inset 0 0 0 1.5px #5a6068, 0 0 0 2px var(--bg-normal), 0 0 0 4px var(--toonation-blue);
}

/* When the currently selected ink is white, give the draw canvas a slightly
   darker backdrop so the white strokes remain visible while drawing. */
body.ink-is-white #drawCanvas,
body.photo-ink-is-white #photoCanvas {
  background: #e8ecf1;
}
[data-theme="dark"] body.ink-is-white #drawCanvas,
[data-theme="dark"] body.photo-ink-is-white #photoCanvas {
  background: #2a2e35;
}

/* ═══════════════════════════════════════════════════════════
   BUTTON ROWS · used inside panels
   ═══════════════════════════════════════════════════════════ */

.btn-row {
  display: flex;
  gap: var(--s-2);
  flex-wrap: wrap;
  margin-top: var(--s-2);
}

.btn-row .btn {
  flex: 1;
  min-width: 110px;
}

/* ─── Hint / Alert ─── */
.hint {
  margin-top: var(--s-4);
  padding: var(--s-3) var(--s-4);
  background: var(--primary-bg-weak);
  border-left: 3px solid var(--toonation-blue);
  border-radius: var(--r-sm);
  font-size: 13px;
  line-height: 1.5;
  color: var(--toonation-navy);
}

[data-theme="dark"] .hint { color: var(--toonation-blue); }

.hint strong {
  display: block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
  color: var(--toonation-blue);
}

/* ═══════════════════════════════════════════════════════════
   STAGE (canvas area)
   ═══════════════════════════════════════════════════════════ */

.stage {
  background: var(--bg-normal);
  border: 1px solid var(--line-normal);
  border-radius: var(--r-xl);
  overflow: hidden;
}

.stage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line-alternative);
  background: var(--bg-alternative);
}

.stage-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--toonation-blue-50);
  color: var(--toonation-navy);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
}

[data-theme="dark"] .stage-label {
  background: rgba(75, 150, 255, 0.14);
  color: var(--toonation-blue);
}

.stage-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--label-alternative);
  font-weight: 500;
}

.canvas-wrap {
  position: relative;
  background:
    linear-gradient(45deg, var(--fill-alternative) 25%, transparent 25%),
    linear-gradient(-45deg, var(--fill-alternative) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--fill-alternative) 75%),
    linear-gradient(-45deg, transparent 75%, var(--fill-alternative) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  min-height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: var(--s-6);
}

[data-theme="dark"] .canvas-wrap {
  background:
    linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(255,255,255,0.03) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.03) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.03) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
}

canvas {
  max-width: 100%;
  display: block;
  touch-action: none;
}

#drawCanvas, #photoCanvas {
  background: var(--bg-normal);
  border-radius: var(--r-sm);
  box-shadow: var(--elev-1);
  cursor: crosshair;
}

#typeCanvas {
  background: transparent;
}

.empty-state {
  text-align: center;
  color: var(--label-alternative);
  padding: var(--s-8);
}

.empty-state .glyph {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--bg-alternative);
  display: grid;
  place-items: center;
  margin: 0 auto var(--s-3);
  color: var(--toonation-blue);
  box-shadow: var(--elev-1);
  font-size: 24px;
}

.empty-state > div:not(.glyph) {
  font-size: 14px;
  font-weight: 600;
  color: var(--label-normal);
}

/* ═══════════════════════════════════════════════════════════
   GALLERY
   ═══════════════════════════════════════════════════════════ */

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--s-5);
}

.gallery-item {
  background: var(--bg-normal);
  border: 1px solid var(--line-normal);
  border-radius: var(--r-xl);
  overflow: hidden;
  transition: all 0.2s;
  cursor: pointer;
  padding: 0;
}

.gallery-item:hover {
  transform: translateY(-2px);
  border-color: var(--toonation-blue);
  box-shadow: var(--elev-2);
}

.gallery-item img {
  width: 100%;
  height: 160px;
  object-fit: contain;
  background:
    linear-gradient(45deg, var(--fill-alternative) 25%, transparent 25%),
    linear-gradient(-45deg, var(--fill-alternative) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--fill-alternative) 75%),
    linear-gradient(-45deg, transparent 75%, var(--fill-alternative) 75%);
  background-size: 12px 12px;
  background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
  background-color: var(--bg-alternative);
  display: block;
  padding: var(--s-3);
}

.gallery-meta {
  padding: var(--s-3) var(--s-4) 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.gallery-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--label-strong);
  letter-spacing: -0.01em;
}

.gallery-date {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--label-alternative);
}

.gallery-actions {
  display: flex;
  gap: var(--s-1);
  padding: var(--s-3) var(--s-4) var(--s-4);
}

.icon-btn {
  flex: 1;
  padding: 6px 10px;
  background: transparent;
  border: 1px solid var(--line-solid-normal);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--label-normal);
  transition: all 0.15s;
}

.icon-btn:hover {
  background: var(--toonation-blue);
  color: white;
  border-color: var(--toonation-blue);
}

.icon-btn.del:hover {
  background: var(--status-negative);
  border-color: var(--status-negative);
}

.icon-btn.req {
  background: var(--toonation-blue);
  color: white;
  border-color: var(--toonation-blue);
}
.icon-btn.req:hover {
  background: #3b86ef;
  border-color: #3b86ef;
}
.icon-btn.req:disabled {
  background: #9ca3af;
  border-color: #9ca3af;
  cursor: wait;
}

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */

.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: var(--label-strong);
  color: white;
  padding: 12px 20px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  z-index: 1000;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  box-shadow: var(--elev-3);
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ═══════════════════════════════════════════════════════════
   FILE DROP
   ═══════════════════════════════════════════════════════════ */

.file-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1.5px dashed var(--line-solid-normal);
  border-radius: var(--r-lg);
  padding: var(--s-8) var(--s-4);
  text-align: center;
  cursor: pointer;
  background: var(--bg-alternative);
  transition: all 0.15s;
}

.file-drop:hover, .file-drop.over {
  border-color: var(--toonation-blue);
  background: var(--primary-bg-weak);
}

.file-drop .icon {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  background: var(--bg-normal);
  margin: 0 auto var(--s-3);
  display: grid;
  place-items: center;
  color: var(--toonation-blue);
  box-shadow: var(--elev-1);
  font-size: 20px;
}

.file-drop p {
  font-size: 14px;
  color: var(--label-normal);
  font-weight: 600;
}

.file-drop p:last-child {
  font-size: 12px;
  font-weight: 500;
  color: var(--label-alternative);
  margin-top: 4px;
}

.file-drop input { display: none; }

/* ═══════════════════════════════════════════════════════════
   VIEW MANAGEMENT
   ═══════════════════════════════════════════════════════════ */

.view { display: none; }
.view.active { display: block; }

/* ─── Loader ─── */
.loader {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════════════════════ */

footer.app-footer {
  margin-top: var(--s-16);
  padding-top: var(--s-6);

/* ═══════════════════════════════════════════════════════════
   DONATION SIMULATION (Toonation notification UI)
   ═══════════════════════════════════════════════════════════ */

.sim-scene {
  background: #0a0a0e;
  border-radius: var(--r-lg);
  padding: 0;
  min-height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  max-height: 60vh;
}

/* Phase 1 · signature only (fullscreen) */


/* Phase 1 · signature (fullscreen) — identical container to Phase 2 */
/* Both phase containers are fixed to the same 70% horizontal slot of the scene,
   so any image inside them is bounded to the exact same width regardless of
   the image's intrinsic aspect ratio. */
.sim-phase-sig,
.sim-phase-gif {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 15%;
  right: 15%;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
}

.sim-phase-sig { z-index: 2; }
.sim-phase-gif { z-index: 1; }

.sim-phase-sig img,
.sim-phase-gif img {
  /* Fill the fixed-width phase container; height auto preserves aspect ratio. */
  width: 100%;
  max-width: 100%;
  max-height: 100%;
  height: auto;
  object-fit: contain;
  display: block;
}

.sim-phase-sig img {
  filter: drop-shadow(0 6px 24px rgba(75, 150, 255, 0.4));
}

/* ─── Sequence animation (only when .playing is set) ───
   Total cycle: 7 seconds.
   Phase 1 (signature):  0%–43%  (≈ 3s, fade in / hold / instant cut)
   Phase 2 (donation):   43%–100% (≈ 4s, instant on / hold / instant off → loop)
*/
.sim-scene.playing .sim-phase-sig {
  animation: sim-sig-show 7s steps(1, end) infinite;
}

.sim-scene.playing .sim-phase-gif {
  animation: sim-gif-show 7s steps(1, end) infinite;
}

/* No cross-fade: hard switch using step easing.
   Phase 1 visible 0%–43%, then immediately off.
   Phase 2 visible 43%–100%, then loop. */
@keyframes sim-sig-show {
  0%   { opacity: 1; }
  43%  { opacity: 0; }
  100% { opacity: 0; }
}

@keyframes sim-gif-show {
  0%   { opacity: 0; }
  43%  { opacity: 1; }
  100% { opacity: 1; }
}

/* Replay button overlay */
.sim-replay {
  position: absolute;
  top: var(--s-3);
  right: var(--s-3);
  z-index: 3;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.15s;
  backdrop-filter: blur(8px);
}

.sim-replay:hover {
  background: rgba(75, 150, 255, 0.3);
  border-color: rgba(75, 150, 255, 0.5);
}

  .theme-toggle-label { white-space: nowrap; overflow: hidden; }
  .theme-toggle-label > svg + * { display: none; }
  body.sidebar-force-open .app { grid-template-columns: 260px 1fr; }

  body.sidebar-force-open .brand-text,

  body.sidebar-force-open .theme-toggle-label > svg + * { display: inline; }

/* Mobile: sidebar stays as an icon-only collapsed rail, expands on toggle */

  .theme-toggle-label { white-space: nowrap; overflow: hidden; }
  .theme-toggle-label > svg + * { display: none; }

  .sidebar.open {

<script>
/* ═══════════════════════════════════════════════════════════
   SIGNATURE STUDIO
   ═══════════════════════════════════════════════════════════ */

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

/* ─── Today date ─── */
(function(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const el = $('#todayDate');
  if (el) el.textContent = `${yyyy}.${mm}.${dd}`;
})();

/* ─── Theme toggle ─── */
(function(){
  const toggle = $('#themeToggle');
  if (!toggle) return;
  toggle.addEventListener('click', () => {
    const html = document.documentElement;
    html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
  });
})();

/* ─── Brand logo → scroll to top ─── */
(function(){
  const brand = $('#brandHome');
  if (!brand) return;
  brand.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

/* ─── Sidebar toggle (hamburger) ─── */
(function(){
  const toggle = $('#sidebarToggle');
  const toggleMobile = $('#sidebarToggleMobile');
  const sidebar = $('#sidebar');
  const backdrop = $('#sidebarBackdrop');
  const body = document.body;

  // Desktop/tablet/mobile: collapse/expand
  if (toggle) {
    toggle.addEventListener('click', () => {
      const w = window.innerWidth;
      if (w > 1200) {
        // Wide: toggle collapsed state
        body.classList.toggle('sidebar-collapsed');
      } else if (w > 768) {
        // Tablet: toggle force-open
        body.classList.toggle('sidebar-force-open');
      } else {
        // Mobile: toggle expanded overlay
        sidebar.classList.toggle('open');
        body.classList.toggle('sidebar-open');
      }
    });
  }

  // Mobile drawer
  function openMobile() {
    sidebar.classList.add('open');
    body.classList.add('sidebar-open');
  }
  function closeMobile() {
    sidebar.classList.remove('open');
    body.classList.remove('sidebar-open');
  }
  if (toggleMobile) toggleMobile.addEventListener('click', openMobile);
  if (backdrop) backdrop.addEventListener('click', closeMobile);

  // Reset state on resize beyond breakpoints + auto-collapse
  let lastWidth = window.innerWidth;
  let autoCollapsedOnce = false;

  function applyAutoCollapse() {
    const w = window.innerWidth;

    // Mobile drawer cleanup
    if (w > 768) {
      sidebar.classList.remove('open');
      body.classList.remove('sidebar-open');
    }
    if (w > 1200) {
      body.classList.remove('sidebar-force-open');
    }

    // Auto-collapse on narrow desktop/tablet (769–1200px)
    // Auto-expand when back to wide
    if (w > 768 && w <= 1200) {
      if (!body.classList.contains('sidebar-collapsed')) {
        body.classList.add('sidebar-collapsed');
        autoCollapsedOnce = true;
      }
    } else if (w > 1200) {
      // Only auto-expand if we previously auto-collapsed
      if (autoCollapsedOnce && body.classList.contains('sidebar-collapsed')) {
        body.classList.remove('sidebar-collapsed');
        autoCollapsedOnce = false;
      }
    }

    lastWidth = w;
  }

  // Run once on load
  applyAutoCollapse();

  window.addEventListener('resize', applyAutoCollapse);
})();

/* ─── Toast ─── */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ─── Effects controls ─── */
window._fxBgImage = null;

/* ═══════════════════════════════════════════════════════════
   CUSTOM VIDEO EFFECT · user-supplied mp4/webm as background
   ─────────────────────────────────────────────────────────────
   State shape:
     window._fxVideo = {
       url:      object URL of the uploaded file
       el:       <video> element (muted, looped, autoplaying)
       frames:   null | HTMLCanvasElement[]  // pre-extracted for export
       name:     original file name
       w, h:     intrinsic video dimensions
     }
   Live previews draw `el` directly (synchronous). Export pre-extracts
   evenly-spaced frames into `frames` so the synchronous renderFrame()
   encoder loop can pick a frame by normalized time t.
   ═══════════════════════════════════════════════════════════ */
window._fxVideo = null;
const FX_VIDEO_MAX_DIM = 720;   // cap extracted frame resolution (memory)

/* Draw a source (video element or canvas) cover-fitted into W×H. */
function drawVideoCover(ctx, W, H, src) {
  const sw = src.videoWidth || src.width;
  const sh = src.videoHeight || src.height;
  if (!sw || !sh) return false;
  const ar = sw / sh, car = W / H;
  let dw, dh, dx, dy;
  if (ar > car) { dh = H; dw = H * ar; dx = (W - dw) / 2; dy = 0; }
  else          { dw = W; dh = W / ar; dx = 0; dy = (H - dh) / 2; }
  ctx.drawImage(src, dx, dy, dw, dh);
  return true;
}

/* Load a user video file and make it the active "custom-video" effect. */
function handleFxVideoFile(file) {
  if (!file || !file.type.startsWith('video/')) {
    toast('영상 파일(mp4 · webm)만 가능합니다');
    return;
  }
  clearFxVideo();   // revoke any previous video first
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.src = url;
  v.muted = true;
  v.loop = true;
  v.playsInline = true;
  v.preload = 'auto';

  v.addEventListener('loadeddata', () => {
    window._fxVideo = {
      url, el: v, frames: null, name: file.name,
      w: v.videoWidth, h: v.videoHeight
    };
    v.play().catch(() => {});
    const nameEl = document.getElementById('fxVideoName');
    const removeBtn = document.getElementById('fxVideoRemove');
    if (nameEl) nameEl.textContent = file.name;
    if (removeBtn) removeBtn.style.display = '';
    rebuildEffectGalleryStates();
    selectEffect('custom-video');
    toast('영상이 특수 효과로 적용되었습니다');
  }, { once: true });

  v.addEventListener('error', () => {
    toast('영상을 불러올 수 없습니다');
    clearFxVideo();
  }, { once: true });
}

/* Remove the current video and reset to "none" if it was selected. */
function clearFxVideo() {
  if (window._fxVideo) {
    try { window._fxVideo.el.pause(); } catch (e) {}
    URL.revokeObjectURL(window._fxVideo.url);
    window._fxVideo = null;
  }
  const nameEl = document.getElementById('fxVideoName');
  const removeBtn = document.getElementById('fxVideoRemove');
  if (nameEl) nameEl.textContent = '';
  if (removeBtn) removeBtn.style.display = 'none';
  const sel = document.getElementById('fxEffect');
  if (sel && sel.value === 'custom-video') {
    rebuildEffectGalleryStates();
    selectEffect('none');
  } else {
    rebuildEffectGalleryStates();
  }
}

/* Seek a video element to `time` (seconds) and resolve when the frame is ready. */
function seekVideoTo(v, time) {
  return new Promise(resolve => {
    const onSeeked = () => { v.removeEventListener('seeked', onSeeked); resolve(); };
    v.addEventListener('seeked', onSeeked);
    const dur = (v.duration && isFinite(v.duration)) ? v.duration : 0;
    try {
      v.currentTime = dur > 0 ? Math.min(time, Math.max(0, dur - 0.05)) : 0;
    } catch (e) {
      v.removeEventListener('seeked', onSeeked);
      resolve();
    }
  });
}

/* Pre-extract `count` evenly-spaced frames from the active video into
   offscreen canvases. Cached on window._fxVideo.frames so the synchronous
   export render loop can index them by normalized time. */
async function prepareFxVideoFrames(count, onProgress) {
  const vid = window._fxVideo;
  if (!vid) return;
  const v = vid.el;
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  const scale = Math.min(1, FX_VIDEO_MAX_DIM / Math.max(vw, vh));
  const w = Math.max(2, Math.round(vw * scale));
  const h = Math.max(2, Math.round(vh * scale));
  const dur = (v.duration && isFinite(v.duration)) ? v.duration : 0;

  const wasPlaying = !v.paused;
  v.pause();
  const frames = [];
  for (let i = 0; i < count; i++) {
    const time = dur > 0 ? (i / count) * dur : 0;
    await seekVideoTo(v, time);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(v, 0, 0, w, h);
    frames.push(c);
    if (onProgress) onProgress('영상 프레임 추출 중...', 0.02 + (i / count) * 0.08);
  }
  vid.frames = frames;
  if (wasPlaying) v.play().catch(() => {});
}

/* Pick the video frame (canvas) matching normalized time t, and stash it on
   the fx object so paintBackground() can draw it during export. */
function setFxVideoFrameForT(fx, t) {
  if (fx.effect !== 'custom-video') return;
  const vid = window._fxVideo;
  if (vid && vid.frames && vid.frames.length) {
    const idx = Math.min(vid.frames.length - 1, Math.floor(t * vid.frames.length));
    fx._videoFrame = vid.frames[idx];
  }
}


/* ═══════════════════════════════════════════════════════════
   EFFECT GALLERY · Animated card grid for choosing FX
   ─────────────────────────────────────────────────────────────
   Each card renders its effect on a small canvas with a global
   looping rAF clock. Click selects → updates hidden #fxEffect
   <select> which is the existing source of truth.
   ═══════════════════════════════════════════════════════════ */

const FX_CARD_META = [
  { id: 'none',         label: '— 없음',         sub: '효과 끄기' },
  { id: 'custom-video', label: '내 영상',        sub: '영상 업로드' },
  { id: 'stamp',        label: 'Stamp',          sub: '도장 · 낙관' },
  { id: 'epic-fire',    label: 'Epic Fire',      sub: '불꽃 시네마틱' },
  { id: 'matrix',       label: 'Matrix',         sub: '디지털 레인' },
  { id: 'sparks',       label: 'Sparks',         sub: '불꽃' },
  { id: 'cinematic',    label: 'Cinematic',      sub: '시네마틱' },
  { id: 'svip-gold',    label: 'SVIP Gold',      sub: '황금 별빛' },
  { id: 'svip-purple',  label: 'SVIP Purple',    sub: '보랏빛 광선' },
  { id: 'vip-aqua',     label: 'VIP Aqua',       sub: '청록 링' }
];

// Card descriptors filled in by initEffectGallery()
let _fxCards = [];      // [{ effectId, canvas, ctx, fx, cache, themedInk }]
let _fxClockStart = 0;  // performance.now() base
let _fxRafId = null;

function _buildFxCardThemedInk(W, H, fx) {
  const tmpC = document.createElement('canvas');
  tmpC.width = W; tmpC.height = H;
  const tctx = tmpC.getContext('2d');
  tctx.font = "italic 22px 'Caveat', cursive";
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  tctx.fillStyle = (fx.background === 'transparent' && fx.effect === 'none') ? '#0f0e0c' : '#f0f0f0';
  tctx.fillText('Signature', W/2, H/2);
  return renderStyledInk(tmpC, W, H, fx.inkStyle);
}

function _renderFxCardFrame(card, t) {
  const { canvas, ctx, fx, cache, themedInk } = card;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  paintBackground(ctx, W, H, fx);
  applyBackEffects(ctx, W, H, t, fx, cache);
  if (fx.effect === 'stamp') {
    drawStampFrame(ctx, themedInk, t, W, H, cache);
  } else {
    ctx.drawImage(themedInk, 0, 0);
  }
  applyFrontEffects(ctx, W, H, t, fx, cache);
}

let _fxLastFrameMs = 0;
const _FX_FPS = 30;   // card previews don't need 60fps

function _fxLoop(nowMs) {
  _fxRafId = requestAnimationFrame(_fxLoop);

  // Throttle to ~30fps to halve the per-second rendering cost.
  if (nowMs - _fxLastFrameMs < 1000 / _FX_FPS) return;
  _fxLastFrameMs = nowMs;

  // Skip all work when nothing is visible: background tab, or the effects
  // bar is hidden (e.g. Gallery view). This is the main fix for the app
  // feeling sluggish — the loop used to render all 10 cards forever.
  if (document.hidden) return;
  const bar = document.getElementById('fxBar');
  if (!bar || bar.offsetParent === null) return;

  if (_fxClockStart === 0) _fxClockStart = nowMs;
  const loopMs = 3000;
  const t = ((nowMs - _fxClockStart) % loopMs) / loopMs;
  for (const card of _fxCards) {
    // Only render cards that are actually on screen. Cards hidden by the
    // collapsed grid ("더 보기") have display:none → offsetParent === null.
    if (card.canvas.offsetParent === null) continue;
    _renderFxCardFrame(card, t);
  }
}

function initEffectGallery() {
  const grid = document.getElementById('fxGrid');
  if (!grid) return;
  grid.innerHTML = '';
  _fxCards = [];

  for (const meta of FX_CARD_META) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'fx-card';
    card.dataset.effect = meta.id;
    card.innerHTML = `
      <canvas class="fx-card-canvas" width="280" height="128"></canvas>
      <div class="fx-card-name">${meta.label}<small>${meta.sub}</small></div>
      <div class="fx-card-check">✓</div>
    `;
    card.addEventListener('click', () => selectEffect(meta.id));
    grid.appendChild(card);

    const canvas = card.querySelector('.fx-card-canvas');
    const ctx = canvas.getContext('2d');
    // Build fx state for this card (background respects user selection)
    const baseBackground = 'transparent';
    const fx = {
      background: baseBackground,
      bgImage: window._fxBgImage || null,
      effect: meta.id,
      inkStyle: 'plain'
    };
    fx.inkStyle = inkStyleFor(fx);

    const cache = buildParticleCache(canvas.width, canvas.height, fx, 12345);
    // For stamp: pre-compute bbox using themed ink so animation works
    if (fx.effect === 'stamp') {
      const inkPreview = _buildFxCardThemedInk(canvas.width, canvas.height, fx);
      // Use the source (pre-styled text) for bbox so layout is correct
      const tmpForBBox = document.createElement('canvas');
      tmpForBBox.width = canvas.width; tmpForBBox.height = canvas.height;
      const tctx = tmpForBBox.getContext('2d');
      tctx.font = "italic 22px 'Caveat', cursive";
      tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
      tctx.fillStyle = '#000';
      tctx.fillText('Signature', canvas.width/2, canvas.height/2);
      const bbox = computeInkBBox(tmpForBBox);
      if (bbox) cache.stampBBox = bbox;
      _fxCards.push({
        effectId: meta.id, canvas, ctx, fx, cache,
        themedInk: inkPreview
      });
    } else {
      const themedInk = _buildFxCardThemedInk(canvas.width, canvas.height, fx);
      _fxCards.push({ effectId: meta.id, canvas, ctx, fx, cache, themedInk });
    }
  }

  // Highlight currently-selected
  highlightSelectedFxCard();

  // Kick off the global animation loop (single rAF for all cards)
  if (_fxRafId === null) {
    _fxClockStart = 0;
    _fxRafId = requestAnimationFrame(_fxLoop);
  }
}

/* Rebuild all card render contexts — call when fxBackground or bg image changes */
function rebuildEffectGalleryStates() {
  for (const card of _fxCards) {
    const W = card.canvas.width, H = card.canvas.height;
    const baseBackground = 'transparent';
    card.fx = {
      background: baseBackground,
      bgImage: window._fxBgImage || null,
      effect: card.effectId,
      inkStyle: 'plain'
    };
    card.fx.inkStyle = inkStyleFor(card.fx);
    card.cache = buildParticleCache(W, H, card.fx, 12345);
    if (card.fx.effect === 'stamp') {
      const tmpForBBox = document.createElement('canvas');
      tmpForBBox.width = W; tmpForBBox.height = H;
      const tctx = tmpForBBox.getContext('2d');
      tctx.font = "italic 22px 'Caveat', cursive";
      tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
      tctx.fillStyle = '#000';
      tctx.fillText('Signature', W/2, H/2);
      const bbox = computeInkBBox(tmpForBBox);
      if (bbox) card.cache.stampBBox = bbox;
    }
    card.themedInk = _buildFxCardThemedInk(W, H, card.fx);
  }
}

function highlightSelectedFxCard() {
  const selected = document.getElementById('fxEffect').value;
  document.querySelectorAll('.fx-card').forEach(c => {
    c.classList.toggle('active', c.dataset.effect === selected);
  });
}

function selectEffect(effectId) {
  // Choosing the video card without a loaded video opens the file picker instead
  if (effectId === 'custom-video' && !window._fxVideo) {
    const input = document.getElementById('fxVideoInput');
    if (input) input.click();
    return;
  }
  const sel = document.getElementById('fxEffect');
  sel.value = effectId;
  // Dispatch change so any existing listeners on fxEffect still fire
  sel.dispatchEvent(new Event('change'));
  highlightSelectedFxCard();
}

/* If the currently-selected card is hidden by the collapsed grid,
   expand the grid so the user can see it. Called on initial load
   in case a non-default effect was already selected. */
function ensureSelectedVisible() {
  const grid = document.getElementById('fxGrid');
  const toggle = document.getElementById('fxToggle');
  if (!grid || !toggle) return;
  if (!grid.classList.contains('fx-grid-collapsed')) return;
  const selectedId = document.getElementById('fxEffect').value;
  const card = grid.querySelector(`.fx-card[data-effect="${selectedId}"]`);
  if (!card) return;
  // Check if the selected card is currently visible (display !== none)
  if (window.getComputedStyle(card).display === 'none') {
    grid.classList.remove('fx-grid-collapsed');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.querySelector('.fx-toggle-text').textContent = '접기';
  }
}

/* Accordion toggle: collapsed = one row only, expanded = all cards */
function setupFxToggle() {
  const toggle = document.getElementById('fxToggle');
  const grid = document.getElementById('fxGrid');
  if (!toggle || !grid) return;
  toggle.addEventListener('click', () => {
    const collapsed = grid.classList.toggle('fx-grid-collapsed');
    toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    toggle.querySelector('.fx-toggle-text').textContent =
      collapsed ? '더 보기' : '접기';
  });
}


// Initialize gallery on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initEffectGallery();
    setupFxToggle();
    ensureSelectedVisible();
  });
} else {
  initEffectGallery();
  setupFxToggle();
  ensureSelectedVisible();
}

// Re-render gallery cards once webfonts are ready (so 'Signature' uses Caveat)
document.fonts.ready.then(() => {

});

// Custom video upload wiring
(function setupFxVideoControls() {

/* Fixed ink color for the drawing studio (no color picker in this build). */
let currentInkColor = '#0f0e0c';

/* ═══════════════════════════════════════════════════════════
   PART B · DRAW SIGNATURE
   ═══════════════════════════════════════════════════════════ */

const drawCanvas = $('#drawCanvas');
const drawCtx = drawCanvas.getContext('2d');

let drawing = false;
let strokes = [];          // [[{x,y,t,p},...], ...]
let currentStroke = null;
let undoStack = [];

/* Curve-smoothing internal level (Chaikin corner-cutting iterations).
   The UI exposes 4 buttons (Lv0~3) mapped onto these internal levels. */
const SMOOTH_MAX_LEVEL = 10;
const SMOOTH_LV_MAP = { 0: 0, 1: 2, 2: 5, 3: 9 };   // Lv → internal level
let drawSmoothLevel = SMOOTH_LV_MAP[1];              // default Lv1 (약한 보정)

/* New-stroke pen width — set by the thickness buttons (디폴트: 기본 펜 4px). */
let currentPenWidth = 4;

/* Enable/disable the action buttons based on current studio state. */
function updateSigButtons() {
  const has = strokes.length > 0;
  const undo = document.getElementById('drawUndo');
  const clear = document.getElementById('drawClear');
  const preview = document.getElementById('previewUseSig');
  const viewCur = document.getElementById('viewCurrentSig');
  if (undo) undo.disabled = !has;
  if (clear) clear.disabled = !has;
  if (preview) preview.disabled = !has;
  if (viewCur) viewCur.disabled = !currentSignatureURL;
}

function getPointerPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  const evt = e.touches ? e.touches[0] : e;
  return {
    x: (evt.clientX - rect.left) * scaleX,
    y: (evt.clientY - rect.top) * scaleY,
    t: performance.now(),
    p: evt.pressure || 0.5
  };
}

function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const pt = getPointerPos(e);
  currentStroke = { color: currentInkColor, width: currentPenWidth, points: [pt] };
  undoStack = []; // clear redo when new stroke begins
}

function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pt = getPointerPos(e);
  currentStroke.points.push(pt);
  drawSegment(currentStroke, currentStroke.points.length - 2, currentStroke.points.length - 1);
}

function endDraw(e) {
  if (!drawing) return;
  drawing = false;
  if (currentStroke && currentStroke.points.length > 1) {
    // Preserve the raw, unsmoothed points so we can re-smooth from scratch
    // whenever the smoothing slider changes (avoids cumulative smoothing).
    currentStroke.rawPoints = currentStroke.points.slice();
    // Apply current smoothing level to the just-finished stroke.
    currentStroke.points = smoothStroke(currentStroke.rawPoints, drawSmoothLevel);
    strokes.push(currentStroke);
    redrawAll();
  }
  currentStroke = null;
  updateSigButtons();
}

/* Re-apply current smoothing intensity to every stroke, always starting
   from the original raw points. This makes the slider behave like a live
   control without compounding the smoothing each time. */
function reapplySmoothingFromRaw() {
  strokes = strokes.map(s => {
    const raw = s.rawPoints || s.points;
    return { ...s, rawPoints: raw, points: smoothStroke(raw, drawSmoothLevel) };
  });
  redrawAll();
}

function drawSegment(stroke, i1, i2) {
  if (i1 < 0) return;
  const p1 = stroke.points[i1];
  const p2 = stroke.points[i2];
  drawCtx.strokeStyle = stroke.color;
  drawCtx.lineWidth = stroke.width;
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.beginPath();
  drawCtx.moveTo(p1.x, p1.y);
  drawCtx.lineTo(p2.x, p2.y);
  drawCtx.stroke();
}

function drawStroke(stroke) {
  if (stroke.points.length < 2) return;
  drawCtx.strokeStyle = stroke.color;
  drawCtx.lineWidth = stroke.width;
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.beginPath();
  drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
  // Use smooth curves through points
  for (let i = 1; i < stroke.points.length - 1; i++) {
    const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
    const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
    drawCtx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
  }
  const last = stroke.points[stroke.points.length - 1];
  drawCtx.lineTo(last.x, last.y);
  drawCtx.stroke();
}

function redrawAll() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  strokes.forEach(s => drawStroke(s));
}

drawCanvas.addEventListener('mousedown', startDraw);
drawCanvas.addEventListener('mousemove', moveDraw);
drawCanvas.addEventListener('mouseup', endDraw);
drawCanvas.addEventListener('mouseleave', endDraw);
drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
drawCanvas.addEventListener('touchend', endDraw);

/* ─── Pen thickness buttons (얇은/기본/도톰한/두꺼운) ─── */
$$('.pen-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.pen-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPenWidth = parseFloat(btn.dataset.px) || 4;
  });
});

/* ─── Curve-smoothing level buttons (Lv0~3) ─── */
$$('.smooth-lv-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.smooth-lv-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const lv = parseInt(btn.dataset.lv, 10);
    drawSmoothLevel = SMOOTH_LV_MAP[lv] != null ? SMOOTH_LV_MAP[lv] : 0;
    reapplySmoothingFromRaw();
  });
});

$('#drawUndo').addEventListener('click', () => {
  if (strokes.length > 0) {
    undoStack.push(strokes.pop());
    redrawAll();
    updateSigButtons();
  }
});

$('#drawClear').addEventListener('click', () => {
  if (strokes.length === 0) return;
  if (confirm('서명을 삭제하시겠습니까?')) {
    strokes = [];
    undoStack = [];
    redrawAll();
    updateSigButtons();
  }
});

/* Smoothing: point simplification + Chaikin corner-cutting.
   level 0  = raw (no change)
   level 1  = very mild   …   level 10 = very aggressive
   Both simplification distance and Chaikin passes scale non-linearly
   so every step produces a clearly visible difference. */
function smoothStroke(points, level) {
  const lv = Math.max(0, Math.round(level || 0));
  if (lv === 0 || points.length < 3) return points.slice();

  // Simplification distance grows quadratically so high levels remove much
  // more jitter (1→2px, 5→13px, 10→32px).
  const minDist = 1.2 * Math.pow(lv, 1.65);

  // Chaikin passes: 1 at level 1, up to 6 at level 10.
  const iterations = Math.ceil(lv * 0.6);

  let pts = points.slice();

  // 1) Distance-based simplification
  const simplified = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const last = simplified[simplified.length - 1];
    const dx = pts[i].x - last.x, dy = pts[i].y - last.y;
    if (Math.sqrt(dx*dx + dy*dy) >= minDist || i === pts.length - 1) {
      simplified.push(pts[i]);
    }
  }
  pts = simplified;

  // 2) Chaikin corner-cutting
  for (let iter = 0; iter < iterations; iter++) {
    if (pts.length < 3) break;
    const result = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i], p1 = pts[i + 1];
      result.push({ x: 0.75 * p0.x + 0.25 * p1.x, y: 0.75 * p0.y + 0.25 * p1.y, t: p0.t });
      result.push({ x: 0.25 * p0.x + 0.75 * p1.x, y: 0.25 * p0.y + 0.75 * p1.y, t: p1.t });
    }
    result.push(pts[pts.length - 1]);
    pts = result;
  }
  return pts;
}

/* Export drawn signature with transparent background */
function renderDrawToTransparent() {
  const c = document.createElement('canvas');
  c.width = drawCanvas.width;
  c.height = drawCanvas.height;
  const ctx = c.getContext('2d');
  strokes.forEach(stroke => {
    if (stroke.points.length < 2) return;
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
    for (let i = 1; i < stroke.points.length - 1; i++) {
      const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
      const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
      ctx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
    }
    const last = stroke.points[stroke.points.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.stroke();
  });
  return c;
}

/* ═══════════════════════════════════════════════════════════
   PART D · GIF GENERATION (writing animation with pen tip)
   ═══════════════════════════════════════════════════════════ */

/* ───────────────────────────────────────────────────────────
   Worker URL · Fetch the cross-origin worker script and turn
   it into a same-origin Blob URL. This avoids the CORS error
   that otherwise breaks GIF rendering on claude.ai or file://.
   ─────────────────────────────────────────────────────────── */
let cachedWorkerBlobURL = null;

async function getWorkerBlobURL() {
  if (cachedWorkerBlobURL) return cachedWorkerBlobURL;
  const sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js',
    'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js',
    'https://unpkg.com/gif.js@0.2.0/dist/gif.worker.js'
  ];
  let lastErr;
  for (const src of sources) {
    try {
      const resp = await fetch(src);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const code = await resp.text();
      const blob = new Blob([code], { type: 'application/javascript' });
      cachedWorkerBlobURL = URL.createObjectURL(blob);
      return cachedWorkerBlobURL;
    } catch (e) {
      lastErr = e;
      console.warn('Worker fetch failed for', src, e);
    }
  }
  throw new Error('Worker 스크립트를 불러올 수 없습니다: ' + (lastErr && lastErr.message));
}

/* Confirm GIF library loaded */
function ensureGifLib() {
  if (typeof GIF === 'undefined') {
    throw new Error('GIF 라이브러리가 로드되지 않았습니다. 인터넷 연결을 확인하세요.');
  }
}

/* ═══════════════════════════════════════════════════════════
   FFMPEG.WASM LOADER · for MP4 (H.264) encoding
   ─────────────────────────────────────────────────────────────
   ffmpeg.wasm is loaded lazily on first MP4 export. The library
   is ~25MB but is cached by the browser after first load.
   ═══════════════════════════════════════════════════════════ */

let _ffmpegInstance = null;
let _ffmpegLoading = null;

async function ensureFFmpeg(onProgress) {
  if (_ffmpegInstance) return _ffmpegInstance;
  if (_ffmpegLoading) return _ffmpegLoading;

  _ffmpegLoading = (async () => {
    // Inject the ffmpeg umd script if not present
    if (typeof FFmpegWASM === 'undefined' && typeof window.FFmpeg === 'undefined') {
      if (onProgress) onProgress('FFmpeg 라이브러리 다운로드 중...', 0.05);
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/@ffmpeg/[email protected]/dist/umd/ffmpeg.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('FFmpeg 스크립트 로드 실패'));
        document.head.appendChild(script);
      });
    }
    const FFmpeg = (window.FFmpegWASM || window.FFmpeg).FFmpeg;
    const ffmpeg = new FFmpeg();
    if (onProgress) {
      ffmpeg.on('log', ({ message }) => {
        // ffmpeg verbose logs — silent unless needed for debug
      });
      ffmpeg.on('progress', ({ progress }) => {
        if (progress >= 0 && progress <= 1) {
          onProgress('인코딩 중...', 0.4 + progress * 0.55);
        }
      });
    }
    if (onProgress) onProgress('FFmpeg 코어 로딩 중...', 0.15);
    const coreBase = 'https://unpkg.com/@ffmpeg/[email protected]/dist/umd';
    await ffmpeg.load({
      coreURL: `${coreBase}/ffmpeg-core.js`,
      wasmURL: `${coreBase}/ffmpeg-core.wasm`
    });
    _ffmpegInstance = ffmpeg;
    return ffmpeg;
  })();

  return _ffmpegLoading;
}

/* ═══════════════════════════════════════════════════════════
   FRAME RENDERER · Shared by GIF/MP4/WebM encoders
   ─────────────────────────────────────────────────────────────
   Renders each animation frame onto a given canvas context.
   This is the SINGLE SOURCE OF TRUTH for what each frame looks
   like — all three formats produce identical visuals.
   ═══════════════════════════════════════════════════════════ */

/* Prepare a "frame plan" from a source canvas (typed text / photo signature).
   Returns { renderFrame(tctx, t), totalFrames, W, H, outH }.
   transparentMode: if true, no background or footer is drawn — useful for WebM/GIF
   with alpha channel. */
function makeFramePlanFromCanvas(srcCanvas, options = {}) {
  const frames = options.frames || 54;
  const W = srcCanvas.width, H = srcCanvas.height;
  const fx = options.fx || { background: 'transparent', bgImage: null, effect: 'none', inkStyle: 'plain' };
  const transparentMode = !!options.transparentMode;
  // outputFormat hint lets paintBackground choose green-key (GIF) vs black (MP4)
  const outputFormat = options.outputFormat || 'gif';

  // Footer dimensions
  const fh = Math.min(
    SVIP_FOOTER.maxHeight,
    Math.max(SVIP_FOOTER.minHeight, Math.round(W * SVIP_FOOTER.heightRatio))
  );
  // For transparent output, the canvas is just W×H — no footer strip
  const outH = transparentMode ? H : H + fh;

  // Compute ink bbox
  const srcCtx = srcCanvas.getContext('2d');
  const srcData = srcCtx.getImageData(0, 0, W, H);
  let minX = W, maxX = 0, minY = H, maxY = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const a = srcData.data[(y * W + x) * 4 + 3];
      if (a > 10) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (minX > maxX) throw new Error('빈 이미지');

  // For transparent mode, override fx so background/effects are minimal:
  // we keep ink styling but drop background paint and most non-transparency-safe effects.
  const effectiveFx = transparentMode
    ? { ...fx, background: 'transparent', effect: 'none', inkStyle: 'plain', bgImage: null, _outputFormat: outputFormat }
    : { ...fx, _outputFormat: outputFormat };

  const inkSource = renderStyledInk(srcCanvas, W, H, effectiveFx.inkStyle);
  const footerCanvas = transparentMode ? null : renderFooterStrip(W, fh);
  const cache = buildParticleCache(W, H, effectiveFx, 12345);
  if (effectiveFx.effect === 'stamp') {
    const bbox = computeInkBBox(srcCanvas) || { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    cache.stampBBox = bbox;
  }

  function renderFrame(tctx, t) {
    if (transparentMode) {
      tctx.clearRect(0, 0, W, outH);
    } else {
      setFxVideoFrameForT(effectiveFx, t);
      paintBackground(tctx, W, H, effectiveFx);
      applyBackEffects(tctx, W, H, t, effectiveFx, cache);
    }
    if (effectiveFx.effect === 'stamp') {
      drawStampFrame(tctx, inkSource, t, W, H, cache);
    } else {
      const revealX = minX + (maxX - minX + 1) * t;
      const revealRight = Math.min(W, Math.max(0, Math.ceil(revealX) + 1));
      if (revealRight > 0) {
        tctx.drawImage(inkSource, 0, 0, revealRight, H, 0, 0, revealRight, H);
      }
    }
    if (!transparentMode) {
      applyFrontEffects(tctx, W, H, t, effectiveFx, cache);
      if (footerCanvas) tctx.drawImage(footerCanvas, 0, H);
    }
  }

  return { renderFrame, totalFrames: frames, W, H, outH };
}

/* Frame plan from stroke data (hand-drawn). Same interface. */
function makeFramePlanFromStrokes(strokes, W, H, options = {}) {
  const frames = options.frames || 54;
  const fx = options.fx || { background: 'transparent', bgImage: null, effect: 'none', inkStyle: 'plain' };
  const transparentMode = !!options.transparentMode;
  const outputFormat = options.outputFormat || 'gif';

  const fh = Math.min(
    SVIP_FOOTER.maxHeight,
    Math.max(SVIP_FOOTER.minHeight, Math.round(W * SVIP_FOOTER.heightRatio))
  );
  const outH = transparentMode ? H : H + fh;

  const totalPts = strokes.reduce((sum, s) => sum + s.points.length, 0);
  if (totalPts === 0) throw new Error('빈 이미지');

  const effectiveFx = transparentMode
    ? { ...fx, background: 'transparent', effect: 'none', inkStyle: 'plain', bgImage: null, _outputFormat: outputFormat }
    : { ...fx, _outputFormat: outputFormat };

  const footerCanvas = transparentMode ? null : renderFooterStrip(W, fh);
  const cache = buildParticleCache(W, H, effectiveFx, 54321);

  // Pre-render whole ink for stamp
  let prerenderedInk = null;
  if (effectiveFx.effect === 'stamp') {
    const fullInk = document.createElement('canvas');
    fullInk.width = W; fullInk.height = H;
    const fctx = fullInk.getContext('2d');
    for (const stroke of strokes) {
      if (stroke.points.length < 2) continue;
      fctx.strokeStyle = stroke.color;
      fctx.lineWidth = stroke.width;
      fctx.lineCap = 'round';
      fctx.lineJoin = 'round';
      fctx.beginPath();
      fctx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (let i = 1; i < stroke.points.length - 1; i++) {
        const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
        const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
        fctx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
      }
      const last = stroke.points[stroke.points.length - 1];
      fctx.lineTo(last.x, last.y);
      fctx.stroke();
    }
    prerenderedInk = renderStyledInk(fullInk, W, H, 'stamp');
    const bbox = computeInkBBox(fullInk);
    cache.stampBBox = bbox || { x: W * 0.2, y: H * 0.3, w: W * 0.6, h: H * 0.4 };
  }

  function renderFrame(tctx, t) {
    if (transparentMode) {
      tctx.clearRect(0, 0, W, outH);
    } else {
      setFxVideoFrameForT(effectiveFx, t);
      paintBackground(tctx, W, H, effectiveFx);
      applyBackEffects(tctx, W, H, t, effectiveFx, cache);
    }
    if (effectiveFx.effect === 'stamp') {
      drawStampFrame(tctx, prerenderedInk, t, W, H, cache);
    } else {
      // Progressive stroke reveal
      const targetPts = Math.round(totalPts * t);
      const inkCanvas = document.createElement('canvas');
      inkCanvas.width = W; inkCanvas.height = H;
      const ictx = inkCanvas.getContext('2d');
      let drawnPts = 0;
      for (const stroke of strokes) {
        const remaining = targetPts - drawnPts;
        if (remaining <= 0) break;
        const pointsToDraw = Math.min(stroke.points.length, remaining);
        if (pointsToDraw < 2) { drawnPts += pointsToDraw; continue; }
        ictx.strokeStyle = stroke.color;
        ictx.lineWidth = stroke.width;
        ictx.lineCap = 'round';
        ictx.lineJoin = 'round';
        ictx.beginPath();
        ictx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < pointsToDraw - 1; i++) {
          const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
          const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
          ictx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
        }
        if (pointsToDraw > 1) {
          const last = stroke.points[pointsToDraw - 1];
          ictx.lineTo(last.x, last.y);
        }
        ictx.stroke();
        drawnPts += stroke.points.length;
      }
      const inkToUse = renderStyledInk(inkCanvas, W, H, effectiveFx.inkStyle);
      tctx.drawImage(inkToUse, 0, 0);
    }
    if (!transparentMode) {
      applyFrontEffects(tctx, W, H, t, effectiveFx, cache);
      if (footerCanvas) tctx.drawImage(footerCanvas, 0, H);
    }
  }

  return { renderFrame, totalFrames: frames, W, H, outH };
}

/* ═══════════════════════════════════════════════════════════
   MP4 ENCODER · MediaRecorder first, ffmpeg.wasm fallback
   ─────────────────────────────────────────────────────────────
   Tries direct MP4 recording via MediaRecorder (Chrome 100+,
   instant, high quality). Falls back to a WebM→MP4 transcode
   via ffmpeg.wasm for browsers without MP4 MediaRecorder.
   ═══════════════════════════════════════════════════════════ */
async function encodeMp4FromFramePlan(plan, options = {}) {
  const { fps = 24, onProgress } = options;
  const { renderFrame, totalFrames, W, outH } = plan;

  // Even dimensions required by H.264
  const evenW = W % 2 === 0 ? W : W - 1;
  const evenH = outH % 2 === 0 ? outH : outH - 1;
