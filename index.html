  // ── PATH A: Native MP4 MediaRecorder (best when available) ──
  const mp4Candidates = [
    'video/mp4;codecs=h264',
    'video/mp4;codecs=avc1',
    'video/mp4'
  ];
  const nativeMp4Mime = mp4Candidates.find(m =>
    typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(m)
  );

  if (nativeMp4Mime) {
    if (onProgress) onProgress('MP4 녹화 중...', 0.05);
    const tmp = document.createElement('canvas');
    tmp.width = evenW; tmp.height = evenH;
    const tctx = tmp.getContext('2d');
    // Black background for opaque MP4 (compositor below paints over it)
    const stream = tmp.captureStream(fps);
    const recorder = new MediaRecorder(stream, {
      mimeType: nativeMp4Mime,
      videoBitsPerSecond: 6_000_000
    });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.start();
    const frameInterval = 1000 / fps;
    for (let f = 0; f < totalFrames; f++) {
      const t = (f + 1) / totalFrames;
      // Fill black behind every frame so flatten alpha cleanly
      tctx.fillStyle = '#000000';
      tctx.fillRect(0, 0, evenW, evenH);
      renderFrame(tctx, t);
      const track = stream.getVideoTracks()[0];
      if (track && typeof track.requestFrame === 'function') track.requestFrame();
      await new Promise(r => setTimeout(r, frameInterval));
      if (onProgress) onProgress('MP4 녹화 중...', 0.05 + (f / totalFrames) * 0.90);
    }
    await new Promise(r => setTimeout(r, 300));
    const blob = await new Promise(resolve => {
      recorder.onstop = () => resolve(new Blob(chunks, { type: nativeMp4Mime }));
      recorder.stop();
    });
    stream.getTracks().forEach(t => t.stop());
    if (onProgress) onProgress('완료', 1.0);
    return { url: URL.createObjectURL(blob), ext: 'mp4', mime: nativeMp4Mime };
  }

  // ── PATH B: Record WebM via MediaRecorder, transcode with ffmpeg.wasm ──
  if (onProgress) onProgress('WebM 녹화 중 (트랜스코딩 준비)...', 0.05);
  // Use the WebM encoder to get a stream
  const webmCandidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const webmMime = webmCandidates.find(m => MediaRecorder.isTypeSupported(m));
  if (!webmMime) throw new Error('이 브라우저는 영상 녹화를 지원하지 않습니다.');

  const tmp2 = document.createElement('canvas');
  tmp2.width = evenW; tmp2.height = evenH;
  const tctx2 = tmp2.getContext('2d');
  const stream2 = tmp2.captureStream(fps);
  const recorder2 = new MediaRecorder(stream2, {
    mimeType: webmMime,
    videoBitsPerSecond: 6_000_000
  });
  const chunks2 = [];
  recorder2.ondataavailable = e => { if (e.data && e.data.size) chunks2.push(e.data); };
  recorder2.start();
  const frameInterval2 = 1000 / fps;
  for (let f = 0; f < totalFrames; f++) {
    const t = (f + 1) / totalFrames;
    tctx2.fillStyle = '#000000';
    tctx2.fillRect(0, 0, evenW, evenH);
    renderFrame(tctx2, t);
    const track = stream2.getVideoTracks()[0];
    if (track && typeof track.requestFrame === 'function') track.requestFrame();
    await new Promise(r => setTimeout(r, frameInterval2));
    if (onProgress) onProgress('WebM 녹화 중...', 0.05 + (f / totalFrames) * 0.40);
  }
  await new Promise(r => setTimeout(r, 300));
  const webmBlob = await new Promise(resolve => {
    recorder2.onstop = () => resolve(new Blob(chunks2, { type: webmMime }));
    recorder2.stop();
  });
  stream2.getTracks().forEach(t => t.stop());

  // Transcode to MP4
  if (onProgress) onProgress('FFmpeg 로딩...', 0.50);
  const ffmpeg = await ensureFFmpeg((label, r) => {
    if (onProgress) onProgress(label, 0.50 + r * 0.10);
  });
  const inputName = 'in.webm';
  await ffmpeg.writeFile(inputName, new Uint8Array(await webmBlob.arrayBuffer()));
  if (onProgress) onProgress('MP4로 변환 중...', 0.65);
  await ffmpeg.exec([
    '-i', inputName,
    '-c:v', 'libx264',
    '-pix_fmt', 'yuv420p',
    '-preset', 'medium',
    '-crf', '20',
    '-movflags', '+faststart',
    'out.mp4'
  ]);
  try { await ffmpeg.deleteFile(inputName); } catch (_) {}
  const data = await ffmpeg.readFile('out.mp4');
  try { await ffmpeg.deleteFile('out.mp4'); } catch (_) {}
  const blob = new Blob([data.buffer], { type: 'video/mp4' });
  if (onProgress) onProgress('완료', 1.0);
  return { url: URL.createObjectURL(blob), ext: 'mp4', mime: 'video/mp4' };
}

/* ═══════════════════════════════════════════════════════════
   WEBM ENCODER (VP9 via MediaRecorder) — supports alpha
   ═══════════════════════════════════════════════════════════ */
async function encodeWebmFromFramePlan(plan, options = {}) {
  const { fps = 18, onProgress } = options;
  const { renderFrame, totalFrames, W, outH } = plan;

  // Prefer VP9 with alpha — fall back to VP8 if VP9 not supported
  const mimeCandidates = [
    'video/webm;codecs=vp9',  // best, supports alpha on Chromium
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  let chosenMime = '';
  for (const m of mimeCandidates) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(m)) {
      chosenMime = m; break;
    }
  }
  if (!chosenMime) throw new Error('이 브라우저는 WebM 녹화를 지원하지 않습니다.');

  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = outH;
  const tctx = tmp.getContext('2d');

  // captureStream is the bridge from canvas → MediaRecorder
  const stream = tmp.captureStream(fps);
  const recorder = new MediaRecorder(stream, {
    mimeType: chosenMime,
    videoBitsPerSecond: 5_000_000
  });

  const chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

  if (onProgress) onProgress('녹화 중...', 0.05);

  recorder.start();

  const frameInterval = 1000 / fps;
  for (let f = 0; f < totalFrames; f++) {
    const t = (f + 1) / totalFrames;
    renderFrame(tctx, t);
    // Force the captureStream to grab a fresh frame from the canvas
    const track = stream.getVideoTracks()[0];
    if (track && typeof track.requestFrame === 'function') {
      track.requestFrame();
    }
    await new Promise(r => setTimeout(r, frameInterval));
    if (onProgress) onProgress('녹화 중...', 0.05 + (f / totalFrames) * 0.90);
  }
  // Hold the last frame briefly so the video doesn't cut abruptly
  await new Promise(r => setTimeout(r, 400));

  const blob = await new Promise(resolve => {
    recorder.onstop = () => resolve(new Blob(chunks, { type: chosenMime }));
    recorder.stop();
  });
  stream.getTracks().forEach(t => t.stop());
  if (onProgress) onProgress('완료', 1.0);
  return { url: URL.createObjectURL(blob), ext: 'webm', mime: chosenMime };
}

/* ───────────────────────────────────────────────────────────
   Effects · Particle systems for cinematic GIF effects
   ─────────────────────────────────────────────────────────── */

// Deterministic PRNG so the same seed yields the same animation
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Pre-generate particles for the full animation duration
function makeSparkSystem(W, H, count, seed) {
  const rng = mulberry32(seed);
  const sparks = [];
  for (let i = 0; i < count; i++) {
    sparks.push({
      x0: rng() * W,
      y0: H + rng() * 50,        // start near bottom
      vx: (rng() - 0.5) * 0.6,
      vy: -(0.5 + rng() * 1.5),  // float upward
      life: 0.4 + rng() * 0.8,    // 0..1 portion of total time when alive
      birth: rng() * 0.8,         // when it appears (0..0.8 of timeline)
      size: 1 + rng() * 2.5,
      hue: 18 + rng() * 18,       // warm orange range
    });
  }
  return sparks;
}

function makeDustSystem(W, H, count, seed) {
  const rng = mulberry32(seed);
  const dust = [];
  for (let i = 0; i < count; i++) {
    dust.push({
      x0: rng() * W,
      y0: rng() * H,
      vx: (rng() - 0.5) * 0.3,
      vy: 0.2 + rng() * 0.8,      // gentle fall
      size: 0.6 + rng() * 1.8,
      birth: rng(),
      twinkle: rng() * Math.PI * 2,
      bright: 0.4 + rng() * 0.6
    });
  }
  return dust;
}

// Draw all sparks at given normalized progress t in [0,1]
function drawSparks(ctx, sparks, t, W, H) {
  ctx.save();
  for (const s of sparks) {
    const local = (t - s.birth) / s.life;
    if (local < 0 || local > 1) continue;
    const x = s.x0 + s.vx * local * 200;
    const y = s.y0 + s.vy * local * 200;
    // Alpha curve: rise quickly, fade out
    const a = local < 0.1 ? local / 0.1 : 1 - (local - 0.1) / 0.9;
    if (a <= 0) continue;
    const sz = s.size * (1 + (1 - local) * 0.3);
    // Glow
    const grad = ctx.createRadialGradient(x, y, 0, x, y, sz * 4);
    grad.addColorStop(0, `hsla(${s.hue}, 100%, 70%, ${a})`);
    grad.addColorStop(0.4, `hsla(${s.hue - 5}, 100%, 50%, ${a * 0.5})`);
    grad.addColorStop(1, `hsla(${s.hue - 10}, 100%, 30%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, sz * 4, 0, Math.PI * 2);
    ctx.fill();
    // Hot core
    ctx.fillStyle = `hsla(${s.hue + 20}, 100%, 90%, ${a})`;
    ctx.beginPath();
    ctx.arc(x, y, sz * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawDust(ctx, dust, t, W, H) {
  ctx.save();
  for (const d of dust) {
    const local = (t * 1.2 + d.birth) % 1;
    const x = ((d.x0 + d.vx * local * 300) % W + W) % W;
    const y = (d.y0 + d.vy * local * H) % H;
    const tw = Math.sin(t * Math.PI * 4 + d.twinkle) * 0.3 + 0.7;
    const a = d.bright * tw * 0.6;
    ctx.fillStyle = `rgba(255, 252, 240, ${a})`;
    ctx.beginPath();
    ctx.arc(x, y, d.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Spotlight from above (radial light)
function drawSpotlight(ctx, W, H, intensity = 0.6) {
  ctx.save();
  const cx = W / 2, cy = H * 0.15;
  const radius = Math.max(W, H) * 0.7;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  grad.addColorStop(0, `rgba(255, 250, 235, ${0.35 * intensity})`);
  grad.addColorStop(0.4, `rgba(180, 170, 150, ${0.12 * intensity})`);
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ───────────────────────────────────────────────────────────
   SVIP / VIP Effects
   ─────────────────────────────────────────────────────────── */

// Radial burst rays exploding from a center point
function drawRadialBurst(ctx, cx, cy, W, H, t, opts) {
  const { color, count = 24, rotation = 0, intensity = 1 } = opts;
  const maxLen = Math.hypot(W, H);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation + t * 0.4);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const len = maxLen * (0.4 + Math.sin(t * Math.PI * 2 + i) * 0.15 + 0.6);
    const w = 6 + Math.sin(t * 8 + i * 1.7) * 4;
    ctx.save();
    ctx.rotate(angle);
    const grad = ctx.createLinearGradient(0, 0, len, 0);
    grad.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, ${0.6 * intensity})`);
    grad.addColorStop(0.3, `rgba(${color.r}, ${color.g}, ${color.b}, ${0.3 * intensity})`);
    grad.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -w/2);
    ctx.lineTo(len, -w * 0.2);
    ctx.lineTo(len, w * 0.2);
    ctx.lineTo(0, w/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// Star outlines/strokes pulsing in (the giant star of SVIP gold)
function drawGiantStar(ctx, cx, cy, size, t, opts) {
  const { color, glow } = opts;
  ctx.save();
  // Outline pulses
  for (let layer = 0; layer < 3; layer++) {
    const scale = size * (1 + layer * 0.15);
    const pulse = 0.7 + Math.sin(t * Math.PI * 2 + layer) * 0.15;
    ctx.lineWidth = 8 - layer * 2;
    ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${pulse * (1 - layer * 0.3)})`;
    ctx.shadowBlur = glow * pulse;
    ctx.shadowColor = `rgba(${color.r}, ${color.g}, ${color.b}, 0.9)`;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const outer = (i * 2 / 5) * Math.PI - Math.PI / 2;
      const inner = ((i * 2 + 1) / 5) * Math.PI - Math.PI / 2;
      const ox = cx + Math.cos(outer) * scale;
      const oy = cy + Math.sin(outer) * scale;
      const ix = cx + Math.cos(inner) * scale * 0.4;
      const iy = cy + Math.sin(inner) * scale * 0.4;
      if (i === 0) ctx.moveTo(ox, oy);
      else ctx.lineTo(ox, oy);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.stroke();
  }
  ctx.restore();
}

// Twinkling star sprites scattered around
function makeStarSprites(W, H, count, seed) {
  const rng = mulberry32(seed);
  const stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: rng() * W,
      y: rng() * H,
      size: 2 + rng() * 5,
      phase: rng() * Math.PI * 2,
      speed: 1 + rng() * 2,
      birth: rng() * 0.5
    });
  }
  return stars;
}

function drawStarSprites(ctx, stars, t, color) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const tt = (t + s.birth) % 1;
    const twink = (Math.sin(tt * Math.PI * 2 * s.speed + s.phase) + 1) / 2;
    const a = twink * 0.9;
    if (a < 0.05) continue;
    const sz = s.size * (0.7 + twink * 0.6);
    // 4-point sparkle
    ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${a})`;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - sz * 2);
    ctx.lineTo(s.x + sz * 0.4, s.y - sz * 0.4);
    ctx.lineTo(s.x + sz * 2, s.y);
    ctx.lineTo(s.x + sz * 0.4, s.y + sz * 0.4);
    ctx.lineTo(s.x, s.y + sz * 2);
    ctx.lineTo(s.x - sz * 0.4, s.y + sz * 0.4);
    ctx.lineTo(s.x - sz * 2, s.y);
    ctx.lineTo(s.x - sz * 0.4, s.y - sz * 0.4);
    ctx.closePath();
    ctx.fill();
    // Hot core
    ctx.fillStyle = `rgba(255, 255, 255, ${a * 0.9})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, sz * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Falling vertical light streaks (SVIP purple)
function makeVerticalStreaks(W, H, count, seed) {
  const rng = mulberry32(seed);
  const streaks = [];
  for (let i = 0; i < count; i++) {
    streaks.push({
      x: rng() * W,
      offset: rng(),
      speed: 0.5 + rng() * 1.5,
      length: 40 + rng() * 120,
      width: 2 + rng() * 4,
      bright: 0.5 + rng() * 0.5
    });
  }
  return streaks;
}

function drawVerticalStreaks(ctx, streaks, t, W, H, color) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of streaks) {
    const yProgress = ((t * s.speed + s.offset) % 1) * (H + s.length) - s.length;
    const grad = ctx.createLinearGradient(s.x, yProgress, s.x, yProgress + s.length);
    grad.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    grad.addColorStop(0.5, `rgba(${color.r}, ${color.g}, ${color.b}, ${0.7 * s.bright})`);
    grad.addColorStop(1, `rgba(255, 255, 255, ${0.9 * s.bright})`);
    ctx.fillStyle = grad;
    ctx.fillRect(s.x - s.width / 2, yProgress, s.width, s.length);
    // Dots trailing
    for (let i = 0; i < 4; i++) {
      const dotY = yProgress + (i / 4) * s.length;
      const dotA = (i / 4) * s.bright * 0.8;
      ctx.fillStyle = `rgba(${color.r + 30}, ${color.g + 30}, ${color.b + 30}, ${dotA})`;
      ctx.beginPath();
      ctx.arc(s.x, dotY, s.width * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// Rotating ring (VIP aqua)
function drawRotatingRing(ctx, cx, cy, radius, t, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalCompositeOperation = 'lighter';

  // Outer thin ring
  ctx.rotate(t * Math.PI * 2);
  ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.5)`;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 20;
  ctx.shadowColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.stroke();

  // Inner dotted ring rotating opposite
  ctx.save();
  ctx.rotate(-t * Math.PI * 3);
  ctx.fillStyle = `rgba(${color.r + 50}, ${color.g + 50}, ${color.b + 50}, 0.9)`;
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2;
    const x = Math.cos(a) * radius * 0.92;
    const y = Math.sin(a) * radius * 0.92;
    const sz = (i % 6 === 0) ? 3 : 1.2;
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Tick marks (radial lines on ring)
  ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.7)`;
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 30; i++) {
    const a = (i / 30) * Math.PI * 2;
    const inner = radius * 0.95;
    const outer = radius * 1.03;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
    ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
    ctx.stroke();
  }

  // 4 cardinal direction sparkle bursts
  ctx.shadowBlur = 30;
  const burstAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
  for (const a of burstAngles) {
    const x = Math.cos(a) * radius * 1.05;
    const y = Math.sin(a) * radius * 1.05;
    const pulse = (Math.sin(t * Math.PI * 4 + a) + 1) / 2;
    const sz = 8 + pulse * 10;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, sz);
    grad.addColorStop(0, `rgba(255, 255, 255, ${0.9 * pulse})`);
    grad.addColorStop(0.5, `rgba(${color.r}, ${color.g}, ${color.b}, ${0.5 * pulse})`);
    grad.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ─── Confetti particles (multicolored streaks shooting outward, SVIP gold) ───
function makeConfetti(W, H, count, seed) {
  const rng = mulberry32(seed);
  const cx = W / 2, cy = H / 2;
  const palette = [
    { r: 255, g: 90, b: 130 },  // pink
    { r: 100, g: 220, b: 255 }, // cyan
    { r: 255, g: 215, b: 70 },  // yellow
    { r: 140, g: 255, b: 130 }, // green
    { r: 255, g: 150, b: 60 },  // orange
    { r: 220, g: 130, b: 255 }  // purple
  ];
  const pieces = [];
  for (let i = 0; i < count; i++) {
    const angle = rng() * Math.PI * 2;
    const speed = 0.5 + rng() * 1.5;
    pieces.push({
      cx, cy,
      angle,
      speed,
      birth: rng() * 0.3,
      life: 0.6 + rng() * 0.4,
      length: 8 + rng() * 18,
      width: 1.5 + rng() * 2.5,
      color: palette[Math.floor(rng() * palette.length)],
      spin: rng() * Math.PI * 2,
      spinSpeed: (rng() - 0.5) * 4
    });
  }
  return pieces;
}

function drawConfetti(ctx, pieces, t, W, H) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pieces) {
    const local = (t - p.birth) / p.life;
    if (local < 0 || local > 1) continue;
    const dist = local * p.speed * Math.max(W, H) * 0.7;
    const x = p.cx + Math.cos(p.angle) * dist;
    const y = p.cy + Math.sin(p.angle) * dist;
    const a = local < 0.15 ? local / 0.15 : 1 - (local - 0.15) / 0.85;
    if (a <= 0) continue;
    const angle = p.spin + t * p.spinSpeed;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const c = p.color;
    // Trailing streak
    const grad = ctx.createLinearGradient(-p.length, 0, 0, 0);
    grad.addColorStop(0, `rgba(${c.r}, ${c.g}, ${c.b}, 0)`);
    grad.addColorStop(1, `rgba(${c.r}, ${c.g}, ${c.b}, ${a})`);
    ctx.fillStyle = grad;
    ctx.fillRect(-p.length, -p.width/2, p.length, p.width);
    // Hot tip
    ctx.fillStyle = `rgba(255, 255, 255, ${a * 0.8})`;
    ctx.fillRect(-p.width, -p.width/2, p.width * 1.5, p.width);
    ctx.restore();
  }
  ctx.restore();
}

// ─── Pixel rain (SVIP purple — vertical glowing squares cascading down) ───
function makePixelRain(W, H, count, seed) {
  const rng = mulberry32(seed);
  const drops = [];
  // Two distinct color sets for variety
  for (let i = 0; i < count; i++) {
    const purple = rng() < 0.6;
    drops.push({
      x: Math.floor(rng() * W / 8) * 8,  // grid-aligned for pixel feel
      offset: rng(),
      speed: 0.4 + rng() * 1.2,
      length: 30 + Math.floor(rng() * 6) * 12,
      cellH: 6 + Math.floor(rng() * 3) * 2,
      brightness: 0.4 + rng() * 0.6,
      color: purple
        ? { r: 160, g: 130, b: 255 }
        : { r: 100, g: 200, b: 255 }
    });
  }
  return drops;
}

function drawPixelRain(ctx, drops, t, W, H) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const d of drops) {
    const totalH = H + d.length;
    const yHead = ((t * d.speed + d.offset) % 1) * totalH - d.length;
    const cellCount = Math.floor(d.length / d.cellH);
    for (let i = 0; i < cellCount; i++) {
      const cy = yHead + i * d.cellH;
      if (cy < -d.cellH || cy > H) continue;
      // Fade toward the tail
      const fadeIn = (cellCount - i) / cellCount;
      const a = d.brightness * fadeIn * fadeIn;
      // Head is brightest (white)
      if (i === cellCount - 1) {
        ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
      } else {
        ctx.fillStyle = `rgba(${d.color.r}, ${d.color.g}, ${d.color.b}, ${a})`;
      }
      ctx.fillRect(d.x, cy, 6, d.cellH - 1);
    }
  }
  ctx.restore();
}

// ─── Lens flare / star burst (VIP aqua — central radiant cross of light) ───
function drawLensFlare(ctx, cx, cy, W, H, t, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalCompositeOperation = 'lighter';
  const pulse = (Math.sin(t * Math.PI * 2) + 1) / 2;

  // Long horizontal & vertical streaks (like camera lens flare cross)
  const reach = Math.max(W, H) * 0.7;
  for (let pass = 0; pass < 2; pass++) {
    ctx.save();
    if (pass === 1) ctx.rotate(Math.PI / 4); // diagonal cross also
    const horiz = ctx.createLinearGradient(-reach, 0, reach, 0);
    const a = pass === 0 ? 0.7 : 0.35;
    horiz.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    horiz.addColorStop(0.5, `rgba(255, 255, 255, ${a * (0.6 + pulse * 0.4)})`);
    horiz.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    ctx.fillStyle = horiz;
    ctx.fillRect(-reach, -1.5, reach * 2, 3);
    // Vertical
    const vert = ctx.createLinearGradient(0, -reach, 0, reach);
    vert.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    vert.addColorStop(0.5, `rgba(255, 255, 255, ${a * (0.6 + pulse * 0.4)})`);
    vert.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    ctx.fillStyle = vert;
    ctx.fillRect(-1.5, -reach, 3, reach * 2);
    ctx.restore();
  }

  // Central hot point
  const coreSz = 30 + pulse * 20;
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreSz);
  coreGrad.addColorStop(0, `rgba(255, 255, 255, ${0.9 * (0.5 + pulse * 0.5)})`);
  coreGrad.addColorStop(0.3, `rgba(${color.r + 80}, ${color.g + 30}, ${color.b}, ${0.6 * (0.5 + pulse * 0.5)})`);
  coreGrad.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, coreSz, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Dark gradient background for SVIP/VIP effects (deeper than texture)
function drawColoredBackground(ctx, W, H, baseColor) {
  // baseColor is a dim rgb
  ctx.save();
  // Deep gradient
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  grad.addColorStop(0, `rgb(${baseColor.r * 0.6}, ${baseColor.g * 0.6}, ${baseColor.b * 0.6})`);
  grad.addColorStop(1, `rgb(${baseColor.r * 0.15}, ${baseColor.g * 0.15}, ${baseColor.b * 0.15})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// Color presets for each preset
const FX_PRESETS = {
  'svip-gold':   { ray: { r: 255, g: 200, b: 60 },  star: { r: 255, g: 230, b: 100 }, bg: { r: 80, g: 50, b: 20 } },
  'svip-purple': { ray: { r: 140, g: 100, b: 240 }, star: { r: 180, g: 160, b: 255 }, bg: { r: 30, g: 20, b: 70 } },
  'vip-aqua':    { ray: { r: 80, g: 220, b: 240 },  star: { r: 150, g: 240, b: 255 }, bg: { r: 10, g: 30, b: 60 } }
};

/* ═══════════════════════════════════════════════════════════
   STAMP EFFECT · 도장 / 낙관
   ─────────────────────────────────────────────────────────────
   Static look : red ink stamp with weathered noise + box border
   Animation   : antic → accelerating fall (with motion blur)
                 → impact (flash + shake + double shockwave + debris)
                 → small secondary bounce → settle
   ═══════════════════════════════════════════════════════════ */

const STAMP_PALETTE = {
  ink:        '#b21e22',   // classic Korean dojang red (Inchu)
  inkDeep:    '#7d0e12',   // shadowed parts
  borderInk:  '#a01a1d',
  paper:      '#f3e9d2',   // ivory / aged paper backdrop
  paperEdge:  '#dccaa2'
};

/* Seeded RNG for reproducible noise patterns across frames. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Procedural noise mask that simulates the irregular ink coverage of
   a hand-pressed stamp. Returns a canvas the same size as ink, with
   transparent "missing ink" patches eaten out. */
let _stampNoiseCache = null;
function getStampNoiseMask(W, H) {
  if (_stampNoiseCache && _stampNoiseCache.width === W && _stampNoiseCache.height === H) {
    return _stampNoiseCache;
  }
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  // Eat-out random transparent patches (varying sizes for natural look)
  const rng = mulberry32(91173);
  const erase = ctx;
  erase.globalCompositeOperation = 'destination-out';

  // 1) Many small specks (fine grain)
  for (let i = 0; i < Math.floor(W * H / 60); i++) {
    const x = rng() * W, y = rng() * H;
    const r = 0.5 + rng() * 2.0;
    erase.beginPath();
    erase.arc(x, y, r, 0, Math.PI * 2);
    erase.fillStyle = `rgba(0,0,0,${0.3 + rng() * 0.7})`;
    erase.fill();
  }
  // 2) A few medium "skipped" patches
  for (let i = 0; i < 14; i++) {
    const x = rng() * W, y = rng() * H;
    const r = 4 + rng() * 10;
    erase.beginPath();
    erase.arc(x, y, r, 0, Math.PI * 2);
    erase.fillStyle = `rgba(0,0,0,${0.15 + rng() * 0.3})`;
    erase.fill();
  }
  // 3) A long curved scratch or two
  for (let i = 0; i < 3; i++) {
    erase.beginPath();
    erase.lineCap = 'round';
    erase.lineWidth = 1.4;
    erase.strokeStyle = 'rgba(0,0,0,0.4)';
    const x0 = rng() * W, y0 = rng() * H;
    const x1 = x0 + (rng() - 0.5) * W * 0.3;
    const y1 = y0 + (rng() - 0.5) * H * 0.3;
    erase.moveTo(x0, y0); erase.lineTo(x1, y1); erase.stroke();
  }

  erase.globalCompositeOperation = 'source-over';
  _stampNoiseCache = c;
  return c;
}

/* Convert the input transparent signature canvas into a red stamp:
   red ink fill + noise mask eaten out + slight darker edges + rect border. */
function renderStampInk(srcCanvas, W, H) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // ── Ink layer: red fill + noise eat-out ──
  const inkLayer = document.createElement('canvas');
  inkLayer.width = W; inkLayer.height = H;
  const ictx = inkLayer.getContext('2d');
  ictx.drawImage(srcCanvas, 0, 0);
  ictx.globalCompositeOperation = 'source-in';
  ictx.fillStyle = STAMP_PALETTE.ink;
  ictx.fillRect(0, 0, W, H);
  ictx.globalCompositeOperation = 'destination-in';
  ictx.drawImage(getStampNoiseMask(W, H), 0, 0);

  // ── Border layer: noisy rounded rect around bbox of ink ──
  const bbox = computeInkBBox(srcCanvas);
  if (bbox) {
    drawStampBorder(ctx, bbox, W, H, 1);
  }
  ctx.drawImage(inkLayer, 0, 0);

  // Slight overall multiply for the deep-pressed look
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  return c;
}

/* Compute the tight bounding box of the inked pixels on srcCanvas.
   Used so the stamp border wraps the signature, not the whole canvas. */
function computeInkBBox(srcCanvas, threshold = 16) {
  const W = srcCanvas.width, H = srcCanvas.height;
  const ctx = srcCanvas.getContext('2d');
  const data = ctx.getImageData(0, 0, W, H).data;
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (data[(y * W + x) * 4 + 3] > threshold) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

/* Draw the rectangular stamp border with the same noise treatment.
   The border surrounds the ink bbox with some padding. */
function drawStampBorder(ctx, bbox, W, H, alpha = 1) {
  if (!bbox) return;
  const padX = Math.max(14, bbox.w * 0.07);
  const padY = Math.max(14, bbox.h * 0.15);
  const x = Math.max(4, bbox.x - padX);
  const y = Math.max(4, bbox.y - padY);
  const w = Math.min(W - x - 4, bbox.w + padX * 2);
  const h = Math.min(H - y - 4, bbox.h + padY * 2);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Build a border-only mask: draw rect twice, eraser pattern between
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext('2d');
  tctx.strokeStyle = STAMP_PALETTE.borderInk;
  tctx.lineWidth = Math.max(3, Math.min(w, h) * 0.025);
  // Outer rounded rect
  const r = 4;
  tctx.beginPath();
  tctx.moveTo(x + r, y);
  tctx.lineTo(x + w - r, y);
  tctx.arcTo(x + w, y, x + w, y + r, r);
  tctx.lineTo(x + w, y + h - r);
  tctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  tctx.lineTo(x + r, y + h);
  tctx.arcTo(x, y + h, x, y + h - r, r);
  tctx.lineTo(x, y + r);
  tctx.arcTo(x, y, x + r, y, r);
  tctx.closePath();
  tctx.stroke();

  // Apply noise mask so the border looks hand-pressed
  tctx.globalCompositeOperation = 'destination-in';
  tctx.drawImage(getStampNoiseMask(W, H), 0, 0);

  ctx.drawImage(tmp, 0, 0);
  ctx.restore();
}

/* Make a system of small debris particles that fly outward from the
   impact point. Used at the moment the stamp hits. */
function makeStampDebris(W, H, bbox, seed = 31337) {
  const rng = mulberry32(seed);
  const debris = [];
  if (!bbox) return debris;
  const cx = bbox.x + bbox.w / 2;
  const cy = bbox.y + bbox.h * 0.92;     // born along bottom edge
  const count = 26;
  for (let i = 0; i < count; i++) {
    const angle = -Math.PI + rng() * Math.PI;   // upper hemisphere bias
    const speed = 60 + rng() * 180;
    debris.push({
      x: cx + (rng() - 0.5) * bbox.w * 0.5,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed * 0.6,         // less vertical so dust spreads out
      r: 1.2 + rng() * 2.6,
      life: 0.6 + rng() * 0.4,
      color: rng() < 0.55 ? STAMP_PALETTE.ink : '#5a3920'
    });
  }
  return debris;
}

/* Draw debris at impact progress u in [0,1]. */
function drawStampDebris(ctx, debris, u, W, H) {
  if (!debris || debris.length === 0) return;
  ctx.save();
  for (const d of debris) {
    const lt = Math.min(1, u / d.life);
    const ease = 1 - Math.pow(1 - lt, 2);
    const x = d.x + d.vx * ease * 0.35;
    const y = d.y + d.vy * ease * 0.35 + ease * ease * 60; // gravity pulls back down
    const alpha = Math.max(0, 1 - lt);
    ctx.fillStyle = d.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, d.r * (1 - lt * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Shockwave ring at impact. Used briefly around t ≈ 0.30-0.45 */
function drawStampShockwave(ctx, bbox, t, W, H) {
  if (!bbox) return;
  const cx = bbox.x + bbox.w / 2;
  const cy = bbox.y + bbox.h / 2;
  const maxR = Math.max(bbox.w, bbox.h) * 1.4;
  const r = maxR * t;
  const alpha = (1 - t) * 0.55;
  ctx.save();
  ctx.strokeStyle = `rgba(178, 30, 34, ${alpha})`;
  ctx.lineWidth = 2 + (1 - t) * 4;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   EPIC FIRE EFFECT · 불꽃 시네마틱
   ─────────────────────────────────────────────────────────────
   Dark backdrop + chrome ink + raging fire from the bottom up,
   floating embers, central back-glow. Modeled after movie title
   "epic trailer" style with flames eating the lower half.
   ═══════════════════════════════════════════════════════════ */

/* Build a large set of fire "blobs" arranged along the bottom that
   each oscillate, rise, and fade. Each blob is a radial gradient
   in lighter blend mode — when stacked they integrate into a body
   of moving flame. */
function makeFireBlobs(W, H, count, seed) {
  const rng = mulberry32(seed);
  const blobs = [];
  for (let i = 0; i < count; i++) {
    blobs.push({
      // born along the bottom 60% of canvas width
      baseX: 0.05 * W + rng() * 0.9 * W,
      // born just below visible area so they rise into view
      baseY: H * (0.85 + rng() * 0.20),
      // rise speed differs per blob
      vy: 30 + rng() * 90,
      // horizontal sway
      swayMag: 8 + rng() * 18,
      swayFreq: 0.6 + rng() * 1.6,
      phase: rng() * Math.PI * 2,
      // radius
      r: 26 + rng() * 60,
      // life cycle (each blob has its own time offset)
      lifeOffset: rng(),
      // hue: 0 = yellow core, 1 = red tip
      hueShift: rng()
    });
  }
  return blobs;
}

function drawFireBlobs(ctx, blobs, t, W, H, intensity = 1.0) {
  if (!blobs) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    // Each blob's local life cycle (0..1), wraps around
    const localT = ((t * 0.8 + b.lifeOffset) % 1);
    // Rises from baseY upward, only goes up by ~55% of canvas height
    const rise = localT * H * 0.55;
    const sway = Math.sin(t * b.swayFreq * 6 + b.phase) * b.swayMag;
    const x = b.baseX + sway;
    const y = b.baseY - rise;
    // Radius shrinks slightly as the blob rises and dies
    const r = b.r * (1.0 - localT * 0.45) * intensity;
    // Fade out by the end of the local cycle
    const alpha = (1 - localT) * 0.75 * intensity;

    // Yellow core / orange mid / red tip / transparent edge
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    if (b.hueShift < 0.5) {
      g.addColorStop(0,    `rgba(255, 235, 130, ${0.95 * alpha})`);
      g.addColorStop(0.25, `rgba(255, 170, 60,  ${0.80 * alpha})`);
      g.addColorStop(0.55, `rgba(230, 80, 30,   ${0.55 * alpha})`);
    } else {
      g.addColorStop(0,    `rgba(255, 200, 90,  ${0.85 * alpha})`);
      g.addColorStop(0.35, `rgba(240, 110, 40,  ${0.70 * alpha})`);
      g.addColorStop(0.65, `rgba(190, 40, 20,   ${0.45 * alpha})`);
    }
    g.addColorStop(1, 'rgba(80, 5, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Floating embers: small bright orange dots that rise upward with
   gentle drift, used in front of and around the text. */
function makeEmbers(W, H, count, seed) {
  const rng = mulberry32(seed);
  const embers = [];
  for (let i = 0; i < count; i++) {
    embers.push({
      x: rng() * W,
      y: H * (0.5 + rng() * 0.5),       // born in lower half
      vy: 20 + rng() * 80,
      vx: (rng() - 0.5) * 30,
      r: 0.6 + rng() * 1.6,
      lifeOffset: rng(),
      blinkPhase: rng() * Math.PI * 2,
      blinkFreq: 2 + rng() * 6
    });
  }
  return embers;
}

function drawEmbers(ctx, embers, t, W, H, intensity = 1.0) {
  if (!embers) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const e of embers) {
    const localT = ((t * 0.6 + e.lifeOffset) % 1);
    const rise = localT * H * 0.75;
    const drift = Math.sin(t * 4 + e.blinkPhase) * 8;
    const x = e.x + drift + e.vx * localT * 0.3;
    const y = e.y - rise;
    // Twinkle
    const twinkle = 0.6 + 0.4 * Math.sin(t * e.blinkFreq * 6 + e.blinkPhase);
    const alpha = (1 - localT) * twinkle * intensity;
    // Bright glow center
    const gr = e.r * 4;
    const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
    g.addColorStop(0, `rgba(255, 240, 180, ${0.95 * alpha})`);
    g.addColorStop(0.3, `rgba(255, 170, 60, ${0.6 * alpha})`);
    g.addColorStop(1, 'rgba(255, 100, 30, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, gr, 0, Math.PI * 2);
    ctx.fill();
    // Hot core dot
    ctx.fillStyle = `rgba(255, 250, 220, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, e.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Cool back-glow behind the text — soft blue/cyan light spilling
   from the upper center. Adds the cinematic separation between
   warm fire and cool key-light. */
function drawBackGlow(ctx, W, H, t, intensity = 1.0) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // Subtle breathing animation
  const breath = 0.85 + 0.15 * Math.sin(t * Math.PI * 2);
  const cx = W * 0.5;
  const cy = H * 0.35;
  const r = Math.max(W, H) * 0.6;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, `rgba(180, 220, 255, ${0.30 * breath * intensity})`);
  g.addColorStop(0.4, `rgba(110, 160, 230, ${0.14 * breath * intensity})`);
  g.addColorStop(1, 'rgba(20, 30, 60, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* Vignette: darken the edges of the canvas slightly to focus the
   eye on the center. Static — applied as the final layer. */
function drawVignette(ctx, W, H, strength = 0.55) {
  ctx.save();
  const g = ctx.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.3,
    W / 2, H / 2, Math.max(W, H) * 0.75
  );
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* Heat haze: subtle warm orange wash overlay on the bottom 60%
   to color-grade the lower flames area. */
function drawHeatWash(ctx, W, H, intensity = 1.0) {
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  const g = ctx.createLinearGradient(0, H * 0.4, 0, H);
  g.addColorStop(0, 'rgba(255, 255, 255, 1)');
  g.addColorStop(0.5, `rgba(255, 180, 130, ${0.55 * intensity})`);
  g.addColorStop(1, `rgba(220, 90, 40, ${0.65 * intensity})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   MATRIX EFFECT · 디지털 레인
   ─────────────────────────────────────────────────────────────
   Classic "Matrix" green digital rain: vertical columns of
   characters drop from top to bottom. Each column has a bright
   "leader" glyph at the bottom and a fading trail above.
   ═══════════════════════════════════════════════════════════ */

const MATRIX_GLYPHS = [
  '○','△','□','×','◇','◯','◎','⬡',
  '0','1','7','9','3','5',
  'A','E','F','I','K','M','S','T','X','Z',
  '+','-','*','/','=','<','>','{','}','[',']',
  'ｱ','ｲ','ｳ','ｴ','ｶ','ｸ','ｺ','ﾅ','ﾆ','ﾑ','ﾐ','ﾒ','ﾗ','ﾘ','ﾙ','ﾜ'
];

const MATRIX_PALETTE = {
  bg:        '#000d05',
  bgGrad:    '#001d10',
  trail:     [0, 230, 80],
  leader:    [180, 255, 200],
  glow:      [0, 255, 110]
};

/* Build matrix columns. */
function makeMatrixColumns(W, H, seed) {
  const rng = mulberry32(seed);
  const targetCols = 26;
  const cellW = Math.max(14, Math.round(W / targetCols));
  const cellH = Math.max(16, Math.round(cellW * 1.05));
  const cols = Math.ceil(W / cellW) + 1;
  const rows = Math.ceil(H / cellH) + 2;

  const columns = [];
  for (let c = 0; c < cols; c++) {
    columns.push({
      x: c * cellW,
      cellW,
      cellH,
      trailLen: 8 + Math.floor(rng() * 14),
      speed: 0.5 + rng() * 1.2,
      offset: rng() * rows * 2,
      brightness: 0.55 + rng() * 0.45,
      seed: Math.floor(rng() * 2147483647),
      flickerPhase: rng() * Math.PI * 2
    });
  }
  return { columns, cellW, cellH, rows, cols };
}

function matrixGlyphAt(col, cellIdx, tSlice) {
  const k = (col.seed ^ (cellIdx * 73856093) ^ (tSlice * 19349663)) >>> 0;
  return MATRIX_GLYPHS[k % MATRIX_GLYPHS.length];
}

function drawMatrixRain(ctx, columnsData, t, W, H) {
  if (!columnsData) return;
  const { columns, cellH, rows } = columnsData;
  const tSlice = Math.floor(t * 8);

  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';

  for (const col of columns) {
    const headCells = col.offset + t * col.speed * (rows + col.trailLen) * 2;
    const headCellInt = Math.floor(headCells);
    const subY = (headCells - headCellInt) * col.cellH;
    const flicker = 0.88 + 0.12 * Math.sin(t * 16 + col.flickerPhase);

    ctx.font = `bold ${Math.round(col.cellH * 0.78)}px "Consolas", "Menlo", "JetBrains Mono", monospace`;

    for (let i = col.trailLen - 1; i >= 0; i--) {
      const cellIdx = headCellInt - i;
      const y = (cellIdx * col.cellH) - subY + col.cellH / 2;
      if (y < -col.cellH || y > H + col.cellH) continue;

      const x = col.x + col.cellW / 2;
      const glyph = matrixGlyphAt(col, cellIdx, tSlice);
      const fade = Math.pow(1 - i / col.trailLen, 1.6);
      const intensity = fade * flicker * col.brightness;

      if (i === 0) {
        ctx.shadowColor = `rgba(${MATRIX_PALETTE.glow.join(',')}, ${0.9 * intensity})`;
        ctx.shadowBlur = 14;
        ctx.fillStyle = `rgba(${MATRIX_PALETTE.leader.join(',')}, ${Math.min(1, intensity + 0.2)})`;
      } else if (i < 3) {
        ctx.shadowColor = `rgba(${MATRIX_PALETTE.glow.join(',')}, ${0.55 * intensity})`;
        ctx.shadowBlur = 6;
        ctx.fillStyle = `rgba(${MATRIX_PALETTE.trail.join(',')}, ${intensity})`;
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = `rgba(${MATRIX_PALETTE.trail.join(',')}, ${intensity * 0.85})`;
      }
      ctx.fillText(glyph, x, y);
    }
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

/* Paint the matrix-style dark green vignette background. */
function paintMatrixBackground(ctx, W, H) {
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  g.addColorStop(0, MATRIX_PALETTE.bgGrad);
  g.addColorStop(1, MATRIX_PALETTE.bg);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ═══════════════════════════════════════════════════════════
   BLACK HOLE EFFECT · 블랙홀
   ─────────────────────────────────────────────────────────────
   Cosmic black hole with a glowing accretion disk and a curved
   light ring above/below (gravitational lensing). Signature
   sits in front of (or beside) the event horizon.
   Inspired by the "Gargantua" visual style.
   ═══════════════════════════════════════════════════════════ */

const BLACK_HOLE_PALETTE = {
  bgInner:   '#0a0a14',
  bgOuter:   '#000000',
  diskHot:   [255, 250, 235],   // hottest part — white-yellow
  diskMid:   [255, 195, 110],   // warm orange-yellow
  diskCool:  [180, 80, 25],     // outer orange
  starDust:  [220, 220, 240]
};

/* Paint deep-space background with subtle nebula tint. */
function paintBlackHoleBackground(ctx, W, H) {
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.8);
  g.addColorStop(0, BLACK_HOLE_PALETTE.bgInner);
  g.addColorStop(1, BLACK_HOLE_PALETTE.bgOuter);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* Pre-generate static star dots for the deep-space backdrop. */
function makeStarfield(W, H, count, seed) {
  const rng = mulberry32(seed);
  const stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: rng() * W,
      y: rng() * H,
      r: 0.3 + rng() * 1.2,
      alpha: 0.3 + rng() * 0.7,
      twinklePhase: rng() * Math.PI * 2,
      twinkleSpeed: 1 + rng() * 3
    });
  }
  return stars;
}

function drawStarfield(ctx, stars, t, W, H) {
  if (!stars) return;
  ctx.save();
  for (const s of stars) {
    const tw = 0.7 + 0.3 * Math.sin(t * s.twinkleSpeed * 4 + s.twinklePhase);
    ctx.fillStyle = `rgba(${BLACK_HOLE_PALETTE.starDust.join(',')}, ${s.alpha * tw})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Make particles that orbit along the accretion disk. */
function makeAccretionParticles(W, H, count, seed, baseRadius) {
  const rng = mulberry32(seed);
  const parts = [];
  for (let i = 0; i < count; i++) {
    parts.push({
      angle: rng() * Math.PI * 2,
      angularVel: 0.4 + rng() * 0.9,      // rotations per cycle
      // Orbital radius offset: most near base, some farther out
      rOffset: (rng() - 0.5) * baseRadius * 0.7,
      // Vertical thickness — disk is flat-ish
      vScale: 0.06 + rng() * 0.12,
      size: 0.6 + rng() * 1.8,
      alpha: 0.4 + rng() * 0.6,
      // Color along yellow→orange ramp
      tint: rng()
    });
  }
  return parts;
}

function drawAccretionParticles(ctx, parts, t, geo) {
  if (!parts) return;
  const { cx, cy, disk, hole } = geo;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const angle = p.angle + p.angularVel * t * Math.PI * 2;
    const r = disk + p.rOffset;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r * p.vScale;
    const c = p.tint < 0.5 ? BLACK_HOLE_PALETTE.diskHot : BLACK_HOLE_PALETTE.diskMid;
    ctx.fillStyle = `rgba(${c.join(',')}, ${p.alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Draw the horizontal accretion disk as a soft glowing band. */
function drawAccretionDisk(ctx, t, geo) {
  const { cx, cy, disk, hole } = geo;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  const layers = [
    { rx: disk * 1.9, ry: disk * 0.30, alpha: 0.10, color: BLACK_HOLE_PALETTE.diskCool },
    { rx: disk * 1.5, ry: disk * 0.22, alpha: 0.18, color: BLACK_HOLE_PALETTE.diskCool },
    { rx: disk * 1.25, ry: disk * 0.16, alpha: 0.30, color: BLACK_HOLE_PALETTE.diskMid },
    { rx: disk * 1.05, ry: disk * 0.10, alpha: 0.50, color: BLACK_HOLE_PALETTE.diskMid },
    { rx: disk * 0.95, ry: disk * 0.05, alpha: 0.70, color: BLACK_HOLE_PALETTE.diskHot }
  ];
  const shimmer = 0.92 + 0.08 * Math.sin(t * Math.PI * 4);
  for (const L of layers) {
    const g = ctx.createRadialGradient(cx, cy, hole * 0.6, cx, cy, L.rx);
    g.addColorStop(0, `rgba(${L.color.join(',')}, 0)`);
    g.addColorStop(0.30, `rgba(${L.color.join(',')}, ${L.alpha * shimmer})`);
    g.addColorStop(0.60, `rgba(${L.color.join(',')}, ${L.alpha * 0.6 * shimmer})`);
    g.addColorStop(1, `rgba(${L.color.join(',')}, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, L.rx, L.ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Draw the gravitationally lensed arcs ABOVE and BELOW the hole. */
function drawLensingArcs(ctx, t, geo) {
  const { cx, cy, hole } = geo;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  const arcRadius = hole * 1.18;
  const arcThickness = hole * 0.15;
  const pulse = 0.9 + 0.1 * Math.sin(t * Math.PI * 3);

  // Top arc
  ctx.strokeStyle = `rgba(${BLACK_HOLE_PALETTE.diskHot.join(',')}, ${0.85 * pulse})`;
  ctx.lineWidth = arcThickness;
  ctx.shadowColor = `rgba(${BLACK_HOLE_PALETTE.diskMid.join(',')}, ${0.7 * pulse})`;
  ctx.shadowBlur = 20;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.ellipse(cx, cy, arcRadius, arcRadius * 0.95, 0,
              Math.PI * 1.10, Math.PI * 1.90);
  ctx.stroke();

  // Bottom arc — slightly thinner
  ctx.strokeStyle = `rgba(${BLACK_HOLE_PALETTE.diskHot.join(',')}, ${0.70 * pulse})`;
  ctx.lineWidth = arcThickness * 0.85;
  ctx.shadowColor = `rgba(${BLACK_HOLE_PALETTE.diskMid.join(',')}, ${0.6 * pulse})`;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.ellipse(cx, cy, arcRadius, arcRadius * 0.95, 0,
              Math.PI * 0.10, Math.PI * 0.90);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

/* Draw the event horizon — a solid black sphere with a subtle rim glow. */
function drawEventHorizon(ctx, geo) {
  const { cx, cy, hole } = geo;
  ctx.save();
  // Outer photon ring glow
  const ringGlow = ctx.createRadialGradient(cx, cy, hole * 0.85,
                                             cx, cy, hole * 1.15);
  ringGlow.addColorStop(0, 'rgba(255, 220, 160, 0)');
  ringGlow.addColorStop(0.5, 'rgba(255, 220, 160, 0.35)');
  ringGlow.addColorStop(1, 'rgba(255, 180, 100, 0)');
  ctx.fillStyle = ringGlow;
  ctx.beginPath();
  ctx.arc(cx, cy, hole * 1.15, 0, Math.PI * 2);
  ctx.fill();

  // The black hole itself
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(cx, cy, hole, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* Compute the base radii and center for the current canvas.
   The hole is positioned slightly below center so the signature
   (which sits horizontally centered) can be read above it. */
function blackHoleGeometry(W, H) {
  const minDim = Math.min(W, H);
  return {
    cx: W / 2,
    cy: H * 0.72,                // pushed below center
    hole: minDim * 0.16,
    disk: minDim * 0.38
  };
}

/* ═══════════════════════════════════════════════════════════
   FIRE RING EFFECT · 화염 링 인트로
   ─────────────────────────────────────────────────────────────
   Cinematic title intro: a ring of fire blossoms in the center,
   text appears inside, then the fire calms into a glowing
   orange ring while sparks settle. Models the dramatic "logo
   reveal" trailer template.
   ═══════════════════════════════════════════════════════════ */

const FIRE_RING_PALETTE = {
  bgInner:    '#2a160a',
  bgOuter:    '#0a0604',
  ringHot:    [255, 235, 140],
  ringMid:    [255, 145, 40],
  ringDeep:   [200, 60, 20]
};

/* Background paint: dark vignetted warm gradient. */
function paintFireRingBackground(ctx, W, H, t) {
  // The background subtly warms during the explosion phase
  const burn = Math.min(1, t < 0.6 ? t * 1.5 : (1 - t) * 1.2);
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.75);
  g.addColorStop(0, `rgb(${Math.round(40 + burn * 50)}, ${Math.round(20 + burn * 20)}, ${Math.round(10 + burn * 5)})`);
  g.addColorStop(1, FIRE_RING_PALETTE.bgOuter);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* Generate fire blobs that orbit around the ring center, producing
   a churning, swirling halo of flame. */
function makeFireRingBlobs(W, H, count, seed) {
  const rng = mulberry32(seed);
  const blobs = [];
  for (let i = 0; i < count; i++) {
    blobs.push({
      // Angular position around the ring (0..2π), with some spread
      angle: rng() * Math.PI * 2,
      // Angular velocity (rad/cycle) — different per blob so they swirl
      angularVel: (rng() - 0.5) * 1.4,
      // Radial offset from the base ring radius (some inside, some outside)
      radialOffset: (rng() - 0.5) * 30,
      // Radial pulsing
      radialPulseMag: 4 + rng() * 10,
      radialPulseFreq: 0.8 + rng() * 1.6,
      phase: rng() * Math.PI * 2,
      // Blob size
      r: 22 + rng() * 50,
      // Per-blob life offset for flicker
      lifeOffset: rng(),
      // Hue: 0 yellow-core, 1 red-tip
      hueShift: rng()
    });
  }
  return blobs;
}

/* Draw the swirling fire ring blobs.
   intensity 0..1 controls overall brightness/size (used to fade ring). */
function drawFireRingBlobs(ctx, blobs, t, W, H, baseRadius, intensity) {
  if (!blobs || intensity <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cx = W / 2;
  const cy = H / 2;
  for (const b of blobs) {
    const angle = b.angle + b.angularVel * t * Math.PI * 2;
    const radialPulse = Math.sin(t * b.radialPulseFreq * 6 + b.phase) * b.radialPulseMag;
    const r = baseRadius + b.radialOffset + radialPulse;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    const blobR = b.r * intensity * (0.85 + 0.15 * Math.sin(t * 12 + b.phase));
    const alpha = intensity * 0.85;

    const g = ctx.createRadialGradient(x, y, 0, x, y, blobR);
    if (b.hueShift < 0.5) {
      g.addColorStop(0,    `rgba(255, 235, 130, ${0.95 * alpha})`);
      g.addColorStop(0.30, `rgba(255, 165, 55,  ${0.80 * alpha})`);
      g.addColorStop(0.60, `rgba(225, 75, 25,   ${0.50 * alpha})`);
    } else {
      g.addColorStop(0,    `rgba(255, 205, 95,  ${0.85 * alpha})`);
      g.addColorStop(0.40, `rgba(235, 105, 35,  ${0.70 * alpha})`);
      g.addColorStop(0.70, `rgba(185, 40, 20,   ${0.40 * alpha})`);
    }
    g.addColorStop(1, 'rgba(70, 5, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, blobR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Draw the static glowing ring (the calm "halo" remaining after the
   explosion subsides). alpha controls visibility. */
function drawGlowRing(ctx, W, H, radius, t, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cx = W / 2, cy = H / 2;
  // Thin bright core ring
  ctx.strokeStyle = `rgba(${FIRE_RING_PALETTE.ringHot.join(',')}, ${0.9 * alpha})`;
  ctx.lineWidth = 2;
  ctx.shadowColor = `rgba(${FIRE_RING_PALETTE.ringMid.join(',')}, ${0.8 * alpha})`;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.stroke();
  // Outer mid-glow ring
  ctx.strokeStyle = `rgba(${FIRE_RING_PALETTE.ringMid.join(',')}, ${0.45 * alpha})`;
  ctx.lineWidth = 5;
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}

/* Outward burst sparks that fly from the ring at the moment of full
   ignition (t ≈ 0.35..0.55). */
function makeFireRingSparks(W, H, count, seed) {
  const rng = mulberry32(seed);
  const sparks = [];
  for (let i = 0; i < count; i++) {
    const angle = rng() * Math.PI * 2;
    const speed = 80 + rng() * 240;
    sparks.push({
      angle,
      speed,
      r: 1.2 + rng() * 2.5,
      lifeOffset: rng(),
      hot: rng() < 0.5
    });
  }
  return sparks;
}

function drawFireRingSparks(ctx, sparks, t, W, H, baseRadius, intensity) {
  if (!sparks || intensity <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cx = W / 2, cy = H / 2;
  for (const s of sparks) {
    const localT = Math.min(1, (t + s.lifeOffset * 0.3));
    const dist = baseRadius * 0.6 + localT * s.speed * 0.8;
    const x = cx + Math.cos(s.angle) * dist;
    const y = cy + Math.sin(s.angle) * dist + localT * localT * 30; // light gravity
    const alpha = (1 - localT) * intensity;
    if (alpha <= 0) continue;
    // Bright core dot
    ctx.fillStyle = s.hot
      ? `rgba(255, 240, 180, ${alpha})`
      : `rgba(255, 170, 70, ${alpha * 0.9})`;
    ctx.beginPath();
    ctx.arc(x, y, s.r, 0, Math.PI * 2);
    ctx.fill();
    // Soft glow
    const g = ctx.createRadialGradient(x, y, 0, x, y, s.r * 5);
    g.addColorStop(0, `rgba(255, 200, 90, ${0.6 * alpha})`);
    g.addColorStop(1, 'rgba(255, 100, 30, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, s.r * 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* Compose one frame of the fire-ring intro.
   Layers (back to front):
     1. Background (painted by paintBackground)
     2. Back half of the swirling fire ring (orbit angle behind center)
     3. The text/ink (faded in over time)
     4. Front half of the swirling fire ring (orbit angle in front)
     5. Outward burst sparks
     6. Calm glowing ring overlay
   Timeline by t ∈ [0,1]:
     0.00 .. 0.20 — Ring radius grows from 0 to full; flames build up.
     0.20 .. 0.55 — Peak inferno; sparks burst outward. Ink starts to
                    fade in at t≈0.35.
     0.55 .. 0.85 — Ink fully visible. Fire calms.
     0.85 .. 1.00 — Only calm glow ring + ink remain.
*/
function drawFireRingFrame(ctx, inkSource, t, W, H, cache) {
  const blobs = cache.fireRingBlobs;
  const sparks = cache.fireRingSparks;
  // Final ring radius scales with canvas — fits ~70% of min dimension
  const finalRadius = Math.min(W, H) * 0.32;

  // Ring scale: 0→1 by t=0.20 (ease out)
  const ringGrowU = Math.min(1, t / 0.20);
  const ringGrowEase = 1 - Math.pow(1 - ringGrowU, 3);
  const ringRadius = finalRadius * ringGrowEase;

  // Inferno intensity: peaks at t ≈ 0.35, fades to 0 by t ≈ 0.85
  let infernoIntensity;
  if (t < 0.20) {
    infernoIntensity = ringGrowEase;                   // ramp up
  } else if (t < 0.55) {
    infernoIntensity = 1.0;                            // full
  } else if (t < 0.85) {
    infernoIntensity = 1.0 - (t - 0.55) / 0.30;        // fade out
  } else {
    infernoIntensity = 0;
  }

  // Ink visibility: fade in 0.35 → 0.60, then full
  let inkAlpha;
  if (t < 0.35) inkAlpha = 0;
  else if (t < 0.60) inkAlpha = (t - 0.35) / 0.25;
  else inkAlpha = 1.0;

  // Calm glow ring: visible from t ≈ 0.55 onward, intensifies as inferno dies
  const glowAlpha = t < 0.55 ? 0 : Math.min(1, (t - 0.55) / 0.30);

  // ── Back-pass of fire blobs (behind ink) ──
  // Use half the blobs to fake "behind" — they get drawn first
  if (blobs && infernoIntensity > 0 && ringRadius > 0) {
    const half = blobs.slice(0, Math.floor(blobs.length / 2));
    drawFireRingBlobs(ctx, half, t, W, H, ringRadius, infernoIntensity);
  }

  // ── Ink with fade ──
  if (inkAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = inkAlpha;
    ctx.drawImage(inkSource, 0, 0);
    ctx.restore();
  }

  // ── Front-pass of fire blobs (in front of ink) ──
  if (blobs && infernoIntensity > 0 && ringRadius > 0) {
    const half = blobs.slice(Math.floor(blobs.length / 2));
    drawFireRingBlobs(ctx, half, t, W, H, ringRadius, infernoIntensity);
  }

  // ── Sparks ──
  // Sparks burst from t=0.30 onward; their internal lifeOffset spreads them
  if (sparks && t > 0.25) {
    const sparkProgress = (t - 0.25) / 0.55;       // 0..1 across full burst window
    drawFireRingSparks(ctx, sparks, sparkProgress, W, H, finalRadius,
      Math.max(0, 1 - sparkProgress));
  }

  // ── Calm glow ring (after inferno) ──
  if (glowAlpha > 0) {
    drawGlowRing(ctx, W, H, finalRadius, t, glowAlpha);
  }
}

/* Main stamp composition for one animation frame.
   Stages by t ∈ [0,1]:
     0.00 .. 0.10 — Antic: stamp hovers high, slightly settling (a breath).
     0.10 .. 0.30 — Accelerating fall with vertical motion blur.
     0.30 .. 0.36 — Impact: white flash, double shockwave, camera shake,
                    debris burst, slight vertical squash on the stamp.
     0.36 .. 0.50 — Second small bounce (1.02 → 1.00).
     0.50 .. 1.00 — Settled: stamp stays static till the end.
*/
function drawStampFrame(ctx, inkSource, t, W, H, cache) {
  const bbox = cache.stampBBox;
  const cx = (bbox ? bbox.x + bbox.w / 2 : W / 2);
  const cy = (bbox ? bbox.y + bbox.h / 2 : H / 2);

  // ── Stage 1: antic (0.00 .. 0.10) ──
  if (t < 0.10) {
    const u = t / 0.10;
    const offsetY = -H * 0.55 + u * 8;            // tiny settle (8px)
    const alpha = 0.55 + u * 0.10;
    const scale = 1.40;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy + offsetY);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);
    ctx.drawImage(inkSource, 0, 0);
    ctx.restore();
    // Faint approaching shadow
    if (bbox) {
      ctx.save();
      ctx.globalAlpha = 0.12 + u * 0.05;
      const sr = bbox.w * 1.05;
      const sx = cx, sy = bbox.y + bbox.h * 0.95;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      g.addColorStop(0, 'rgba(20,10,5,0.5)');
      g.addColorStop(1, 'rgba(20,10,5,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(sx, sy, sr, sr * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    return;
  }

  // ── Stage 2: accelerating fall (0.10 .. 0.30) ──
  if (t < 0.30) {
    const u = (t - 0.10) / 0.20;                  // 0 → 1
    const eased = u * u * u * u * u;              // easeInQuint (sharp acceleration)
    const startScale = 1.40;
    const endScale = 1.05;                        // overshoots a hair before impact
    const scale = startScale + (endScale - startScale) * eased;
    const startOffsetY = -H * 0.55 + 8;
    const offsetY = startOffsetY * (1 - eased);
    const alpha = 0.65 + 0.35 * eased;
    // Tightening shadow under the landing point
    if (bbox) {
      ctx.save();
      ctx.globalAlpha = 0.17 + 0.40 * eased;
      const sx = cx, sy = bbox.y + bbox.h * 0.95;
      const sr = bbox.w * (1.10 - 0.45 * eased);
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      g.addColorStop(0, 'rgba(15,8,4,0.65)');
      g.addColorStop(1, 'rgba(15,8,4,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(sx, sy, sr, sr * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // Motion blur via stacked semi-transparent copies along the fall axis
    ctx.save();
    const blurSteps = 4;
    for (let i = 0; i < blurSteps; i++) {
      const k = i / blurSteps;
      const trailOffset = offsetY - eased * 24 * k;  // copies above the main
      ctx.globalAlpha = alpha * (0.30 - k * 0.06);
      ctx.translate(cx, cy + trailOffset);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
      ctx.drawImage(inkSource, 0, 0);
      // reset transform between trail layers
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    ctx.restore();
    // Main falling stamp
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy + offsetY);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);
    ctx.drawImage(inkSource, 0, 0);
    ctx.restore();
    return;
  }

  // ── Stage 3: impact (0.30 .. 0.36) ──
  if (t < 0.36) {
    const u = (t - 0.30) / 0.06;                  // 0 → 1
    // Vertical squash: scale.y compresses sharply on hit, recovers fast
    const squashY = 1.0 - (1 - Math.abs(2 * u - 1)) * 0.12;   // dip then return
    const squashX = 1.0 + (1 - Math.abs(2 * u - 1)) * 0.08;
    // Camera shake — strongest right at u=0, fades by u=1
    const shakeMag = (1 - u) * 6;
    const shakeX = (Math.random() - 0.5) * shakeMag;
    const shakeY = (Math.random() - 0.5) * shakeMag;

    // The stamp itself
    ctx.save();
    ctx.translate(shakeX, shakeY);
    ctx.translate(cx, cy);
    ctx.scale(squashX, squashY);
    ctx.translate(-cx, -cy);
    ctx.drawImage(inkSource, 0, 0);
    ctx.restore();

    // Two shockwave rings: a fast small one and a slower bigger one
    drawStampShockwave(ctx, bbox, Math.min(1, u * 1.6), W, H);
    drawStampShockwave(ctx, bbox, Math.min(1, u * 0.9), W, H);

    // Debris burst (lazy init)
    if (!cache.stampDebris && bbox) {
      cache.stampDebris = makeStampDebris(W, H, bbox, cache.stampSeed || 31337);
    }
    drawStampDebris(ctx, cache.stampDebris, u, W, H);

    // White flash — strongest at impact start, decays quickly
    const flashAlpha = Math.pow(1 - u, 2) * 0.7;
    if (flashAlpha > 0.01) {
      ctx.save();
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    return;
  }

  // ── Stage 4: second small bounce (0.36 .. 0.50) ──
  if (t < 0.50) {
    const u = (t - 0.36) / 0.14;                  // 0 → 1
    // Soft sinusoidal bounce that decays to 1.0
    const bounce = Math.sin(u * Math.PI) * 0.025 * (1 - u);
    const scale = 1.0 + bounce;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);
    ctx.drawImage(inkSource, 0, 0);
    ctx.restore();

    // Lingering debris (tail end)
    if (cache.stampDebris) {
      drawStampDebris(ctx, cache.stampDebris, 1 + u * 0.5, W, H);
    }
    return;
  }

  // ── Stage 5: settled (0.50 .. 1.00) — static ──
  ctx.drawImage(inkSource, 0, 0);
}


// Cement / dark texture procedural background
let cachedTexture = null;
function getDarkTexture(W, H) {
  if (cachedTexture && cachedTexture.width === W && cachedTexture.height === H) return cachedTexture;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  // Base dark
  ctx.fillStyle = '#0a0a0c';
  ctx.fillRect(0, 0, W, H);
  // Noise grain
  const imgData = ctx.getImageData(0, 0, W, H);
  const rng = mulberry32(42);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const v = rng();
    const n = Math.floor(v * 35);
    imgData.data[i] = 12 + n;
    imgData.data[i + 1] = 12 + n;
    imgData.data[i + 2] = 14 + n;
    imgData.data[i + 3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
  // Larger blotches for cement feel
  for (let i = 0; i < 80; i++) {
    const x = rng() * W, y = rng() * H;
    const r = 20 + rng() * 60;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = rng() < 0.5;
    grad.addColorStop(0, dark ? 'rgba(0,0,0,0.4)' : 'rgba(60,55,50,0.15)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // Vignette
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.2, W/2, H/2, Math.max(W,H)*0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  cachedTexture = c;
  return c;
}

// Render ink with chrome/metallic look. Takes an alpha mask canvas.
function renderChromeInk(srcCanvas, W, H) {
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');

  // Draw original ink lightly first
  ctx.drawImage(srcCanvas, 0, 0);

  // Create a vertical metallic gradient applied only to ink area
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#f5f5f5');
  grad.addColorStop(0.3, '#a8a8a8');
  grad.addColorStop(0.5, '#e8e8e8');
  grad.addColorStop(0.7, '#5a5a5a');
  grad.addColorStop(1, '#cfcfcf');

  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // Soft outer glow for chrome rim
  const glow = document.createElement('canvas');
  glow.width = W; glow.height = H;
  const gctx = glow.getContext('2d');
  gctx.filter = 'blur(2px)';
  gctx.drawImage(srcCanvas, 0, 0);
  gctx.globalCompositeOperation = 'source-in';
  gctx.fillStyle = 'rgba(255, 240, 220, 0.5)';
  gctx.fillRect(0, 0, W, H);

  const combined = document.createElement('canvas');
  combined.width = W; combined.height = H;
  const cctx = combined.getContext('2d');
  cctx.drawImage(glow, 0, 0);
  cctx.drawImage(out, 0, 0);
  return combined;
}

/* Apply current effects to a transparent signature canvas, producing
 * a static image with background + effects + ink composited.
 * Used by PNG export when an effect is selected. */
function renderStaticWithEffects(srcCanvas) {
  const W = srcCanvas.width, H = srcCanvas.height;
  const fx = getEffectsState();

  let out;
  if (isTransparent(fx)) {
    // No effects → use the source canvas directly
    out = srcCanvas;
  } else {
    out = document.createElement('canvas');
    out.width = W; out.height = H;
    const ctx = out.getContext('2d');

    const cache = buildParticleCache(W, H, fx, 12345);
    const t = 0.7;

    paintBackground(ctx, W, H, fx);
    applyBackEffects(ctx, W, H, t, fx, cache);

    const inkToUse = renderStyledInk(srcCanvas, W, H, fx.inkStyle);
    ctx.drawImage(inkToUse, 0, 0);

    applyFrontEffects(ctx, W, H, t, fx, cache);
  }

  // Always attach SVIP footer at the bottom
  return attachSvipFooter(out);
}

/* ═══════════════════════════════════════════════════════════
   SVIP FOOTER · attaches branded footer strip to any canvas
   ═══════════════════════════════════════════════════════════ */

const SVIP_FOOTER = {
  text: 'SVIP Signature Effect',
  bg: '#000028',         // deep navy
  dividerTop: '#D0B888', // soft gold
  dividerBottom: 'rgba(75, 150, 255, 0.25)',
  gold: '#F8C000',
  goldShadow: '#8C6500',
  font: '700 22px "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif',
  // Footer height as a ratio of the source width (so it scales with canvas size)
  heightRatio: 0.085, // about 8.5% — produces ~28-32px on 380px tall canvases
  minHeight: 44,
  maxHeight: 72,
};

/* Returns a NEW canvas with just the footer strip (W × fh).
 * Used by both the static PNG path and the per-frame GIF generation. */
function renderFooterStrip(W, fh) {
  const c = document.createElement('canvas');
  c.width = W;
  c.height = fh;
  const ctx = c.getContext('2d');

  // 1. Footer background (deep navy)
  ctx.fillStyle = SVIP_FOOTER.bg;
  ctx.fillRect(0, 0, W, fh);

  // 2. Thin gold divider line at the top
  ctx.fillStyle = SVIP_FOOTER.dividerTop;
  ctx.fillRect(0, 0, W, 1.5);

  // 3. Subtle inner glow just below the divider
  const grad = ctx.createLinearGradient(0, 1.5, 0, 8);
  grad.addColorStop(0, 'rgba(208, 184, 136, 0.35)');
  grad.addColorStop(1, 'rgba(208, 184, 136, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 1.5, W, 7);

  // 4. Footer label — the user's nickname (falls back to brand text).
  //    The nickname entered in the studio is composited here so it appears
  //    together with the signature in the produced video.
  const nick = (typeof window !== 'undefined' && window._sigNickname || '').trim();
  const label = nick ? `${nick} · SVIP Signature` : SVIP_FOOTER.text;
  const fontSize = Math.max(14, Math.round(fh * 0.45));
  ctx.font = `700 ${fontSize}px "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const textX = W / 2;
  const textY = fh / 2 + 2;

  // Drop shadow
  ctx.fillStyle = SVIP_FOOTER.goldShadow;
  ctx.fillText(label, textX + 1, textY + 1);

  // Main gold text + glow
  ctx.save();
  ctx.shadowColor = 'rgba(248, 192, 0, 0.5)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = SVIP_FOOTER.gold;
  ctx.fillText(label, textX, textY);
  ctx.restore();

  // Re-paint the text without shadow on top, sharper
  ctx.fillStyle = SVIP_FOOTER.gold;
  ctx.fillText(label, textX, textY);

  return c;
}

/* Returns a NEW canvas: original content on top + branded footer at bottom.
 * Adds SVIP_FOOTER.height pixels to the bottom. */
function attachSvipFooter(srcCanvas) {
  const W = srcCanvas.width;
  const H = srcCanvas.height;
  const fh = Math.min(
    SVIP_FOOTER.maxHeight,
    Math.max(SVIP_FOOTER.minHeight, Math.round(W * SVIP_FOOTER.heightRatio))
  );

  const out = document.createElement('canvas');
  out.width = W;
  out.height = H + fh;
  const ctx = out.getContext('2d');

  // 1. Original signature content at top
  ctx.drawImage(srcCanvas, 0, 0);

  // 2. Footer strip
  const footer = renderFooterStrip(W, fh);
  ctx.drawImage(footer, 0, H);

  return out;
}


/* Options structure passed to GIF generators:
 *   {
 *     background: 'transparent' | 'image' | 'texture',
 *     bgImage:    HTMLImageElement | null,
 *     effect:     'none' | 'sparks' | 'cinematic',
 *     inkStyle:   'plain' | 'chrome'   // chrome = metallic for cinematic
 *   }
 */

function getEffectsState() {
  const effect = $('#fxEffect').value;
  const fx = {
    background: 'transparent',
    bgImage: window._fxBgImage || null,
    effect,
    inkStyle: 'plain'
  };
  fx.inkStyle = inkStyleFor(fx);
  return fx;
}

// Resolve background → draw onto ctx
function paintBackground(ctx, W, H, opts) {
  if (opts.background === 'image' && opts.bgImage) {
    // Cover fit — only when user explicitly provides an image
    const img = opts.bgImage;
    const ar = img.width / img.height;
    const car = W / H;
    let dw, dh, dx, dy;
    if (ar > car) {
      dh = H; dw = H * ar; dx = (W - dw) / 2; dy = 0;
    } else {
      dw = W; dh = W / ar; dx = 0; dy = (H - dh) / 2;
    }
    ctx.drawImage(img, dx, dy, dw, dh);
    return;
  }
  // Custom video background: pre-extracted frame (export) or live <video> (preview)
  if (opts.effect === 'custom-video') {
    const src = opts._videoFrame || (window._fxVideo && window._fxVideo.el) || null;
    let drawn = false;
    if (src) drawn = drawVideoCover(ctx, W, H, src);
    if (!drawn) {
      // No video yet — neutral dark fill so the signature stays legible
      ctx.fillStyle = '#15171c';
      ctx.fillRect(0, 0, W, H);
    }
    return;
  }
  // Effect-driven backgrounds override "texture" / "transparent" choices
  if (opts.effect === 'svip-gold' || opts.effect === 'svip-purple' || opts.effect === 'vip-aqua') {
    drawColoredBackground(ctx, W, H, FX_PRESETS[opts.effect].bg);
    return;
  }
  if (opts.effect === 'matrix') {
    paintMatrixBackground(ctx, W, H);
    return;
  }
  if (opts.effect === 'stamp') {
    // Aged paper backdrop — radial vignette from ivory to soft tan
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, STAMP_PALETTE.paper);
    g.addColorStop(1, STAMP_PALETTE.paperEdge);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // Subtle paper grain
    const rng = mulberry32(7777);
    ctx.save();
    ctx.globalAlpha = 0.06;
    for (let i = 0; i < 800; i++) {
      ctx.fillStyle = rng() < 0.5 ? '#000' : '#fff';
      ctx.fillRect(rng() * W, rng() * H, 1, 1);
    }
    ctx.restore();
    return;
  }
  if (opts.background === 'texture' || opts.effect === 'cinematic' || opts.effect === 'epic-fire') {
    ctx.drawImage(getDarkTexture(W, H), 0, 0);
    return;
  }
  // No effect, but an opaque composite is requested (시그니처 사용하기 flow):
  // paint a light "paper" gradient so the dark signature ink stays legible.
  if (opts.effect === 'none' && opts._noneBg) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, opts._noneBg);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    return;
  }
  // Transparent → fill with green key (GIF) or black (MP4)
  if (opts._outputFormat === 'mp4') {
    ctx.fillStyle = '#000000';
  } else {
    ctx.fillStyle = '#00ff00';
  }
  ctx.fillRect(0, 0, W, H);
}

// Whether the GIF should use transparency
function isTransparent(opts) {
  return opts.background === 'transparent' && opts.effect === 'none';
}

/* Apply BEHIND-ink effects (background, spotlight, dust, rays).
 * Call this AFTER paintBackground but BEFORE drawing the ink. */
function applyBackEffects(ctx, W, H, t, fx, particleCache) {
  if (fx.effect === 'cinematic') {
    drawSpotlight(ctx, W, H, 0.7);
    if (particleCache.dust) drawDust(ctx, particleCache.dust, t, W, H);
  } else if (fx.effect === 'svip-gold') {
    // Burst rays from center — bigger, faster rotating for fanfare
    drawRadialBurst(ctx, W/2, H/2, W, H, t, {
      color: FX_PRESETS['svip-gold'].ray, count: 36, intensity: 1.0
    });
    // Soft inner glow
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H)*0.5);
    grad.addColorStop(0, 'rgba(255, 230, 130, 0.55)');
    grad.addColorStop(1, 'rgba(255, 230, 130, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // Giant star outline behind the ink
    drawGiantStar(ctx, W/2, H/2, Math.min(W,H) * 0.42, t, {
      color: FX_PRESETS['svip-gold'].star, glow: 30
    });
  } else if (fx.effect === 'svip-purple') {
    // Pixel rain cascade (signature look)
    if (particleCache.pixels) drawPixelRain(ctx, particleCache.pixels, t, W, H);
    // Vertical streaks for depth
    if (particleCache.streaks) drawVerticalStreaks(ctx, particleCache.streaks, t, W, H, FX_PRESETS['svip-purple'].ray);
    // Center glow
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H)*0.55);
    grad.addColorStop(0, 'rgba(160, 130, 255, 0.45)');
    grad.addColorStop(1, 'rgba(160, 130, 255, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  } else if (fx.effect === 'vip-aqua') {
    // Subtle radial burst behind
    drawRadialBurst(ctx, W/2, H/2, W, H, t, {
      color: FX_PRESETS['vip-aqua'].ray, count: 20, intensity: 0.45
    });
    // Center glow
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H)*0.55);
    grad.addColorStop(0, 'rgba(100, 230, 255, 0.45)');
    grad.addColorStop(1, 'rgba(100, 230, 255, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  } else if (fx.effect === 'epic-fire') {
    // Cool blue back-glow behind the text (cinematic separation)
    drawBackGlow(ctx, W, H, t, 1.0);
    // First (background) pass of fire blobs — lower intensity to layer
    // behind the ink. Uses ~half the blobs so we don't over-paint.
    if (particleCache.fireBlobs) {
      const half = particleCache.fireBlobs.slice(0, Math.floor(particleCache.fireBlobs.length / 2));
      drawFireBlobs(ctx, half, t, W, H, 0.85);
    }
  } else if (fx.effect === 'matrix') {
    // Full matrix rain behind the ink so the signature reads on top.
    if (particleCache.matrix) drawMatrixRain(ctx, particleCache.matrix, t, W, H);
  }
}

/* Apply IN-FRONT-of-ink effects (sparks, stars, ring, confetti).
 * Call this AFTER drawing the ink. */
function applyFrontEffects(ctx, W, H, t, fx, particleCache) {
  if (fx.effect === 'sparks' || fx.effect === 'cinematic') {
    if (particleCache.sparks) drawSparks(ctx, particleCache.sparks, t, W, H);
  } else if (fx.effect === 'svip-gold') {
    if (particleCache.confetti) drawConfetti(ctx, particleCache.confetti, t, W, H);
    if (particleCache.stars) drawStarSprites(ctx, particleCache.stars, t, FX_PRESETS['svip-gold'].star);
  } else if (fx.effect === 'svip-purple') {
    if (particleCache.stars) drawStarSprites(ctx, particleCache.stars, t, FX_PRESETS['svip-purple'].star);
  } else if (fx.effect === 'vip-aqua') {
    // Lens flare cross over center
    drawLensFlare(ctx, W/2, H/2, W, H, t, FX_PRESETS['vip-aqua'].ray);
    if (particleCache.stars) drawStarSprites(ctx, particleCache.stars, t, FX_PRESETS['vip-aqua'].star);
    // Rotating ring centered on the canvas
    const radius = Math.min(W, H) * 0.36;
    drawRotatingRing(ctx, W/2, H/2, radius, t, FX_PRESETS['vip-aqua'].ray);
  } else if (fx.effect === 'epic-fire') {
    // Second (foreground) pass of fire blobs — covers the lower portion
    // of the ink and creates the "flames eating the text" look.
    if (particleCache.fireBlobs) {
      const half = particleCache.fireBlobs.slice(Math.floor(particleCache.fireBlobs.length / 2));
      drawFireBlobs(ctx, half, t, W, H, 1.0);
    }
    // Floating embers in front of everything
    if (particleCache.embers) {
      drawEmbers(ctx, particleCache.embers, t, W, H, 1.0);
    }
    // Soft vignette to focus center
    drawVignette(ctx, W, H, 0.5);
  }
}

/* Build a fresh particle cache for the entire animation. */
function buildParticleCache(W, H, fx, seed) {
  const cache = {};
  if (fx.effect === 'sparks' || fx.effect === 'cinematic') {
    cache.sparks = makeSparkSystem(W, H, 60, seed);
  }
  if (fx.effect === 'cinematic') {
    cache.dust = makeDustSystem(W, H, 80, seed + 1);
  }
  if (fx.effect === 'svip-gold' || fx.effect === 'svip-purple' || fx.effect === 'vip-aqua') {
    cache.stars = makeStarSprites(W, H, 60, seed + 2);
  }
  if (fx.effect === 'svip-gold') {
    cache.confetti = makeConfetti(W, H, 80, seed + 4);
  }
  if (fx.effect === 'svip-purple') {
    cache.streaks = makeVerticalStreaks(W, H, 30, seed + 3);
    cache.pixels = makePixelRain(W, H, 50, seed + 5);
  }
  if (fx.effect === 'stamp') {
    // bbox computed lazily inside applyBack/Front because it depends on srcCanvas
    cache.stampSeed = seed + 6;
  }
  if (fx.effect === 'epic-fire') {
    cache.fireBlobs = makeFireBlobs(W, H, 60, seed + 7);
    cache.embers = makeEmbers(W, H, 50, seed + 8);
  }
  if (fx.effect === 'matrix') {
    cache.matrix = makeMatrixColumns(W, H, seed + 9);
  }
  return cache;
}

/* Determine ink style for an effect (chrome, gold, etc). */
function inkStyleFor(fx) {
  if (fx.effect === 'cinematic') return 'chrome';
  if (fx.effect === 'epic-fire') return 'chrome';
  if (fx.effect === 'svip-gold') return 'gold';
  if (fx.effect === 'svip-purple') return 'purple-chrome';
  if (fx.effect === 'vip-aqua') return 'aqua-chrome';
  if (fx.effect === 'stamp') return 'stamp';
  if (fx.effect === 'matrix') return 'matrix-green';
  return 'plain';
}

/* Render ink with the chosen metallic/themed style */
function renderStyledInk(srcCanvas, W, H, style) {
  if (style === 'plain') return srcCanvas;
  if (style === 'chrome') return renderChromeInk(srcCanvas, W, H);
  if (style === 'stamp') return renderStampInk(srcCanvas, W, H);
